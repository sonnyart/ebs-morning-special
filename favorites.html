<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>즐겨찾기 모음 · 모닝스페셜</title>
<style>
  :root { --accent:#8a6d3b; --bg:#faf6ef; --card:#fff; --ink:#241f17; --kr:#6b6356; --line:#ece3d3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans KR','Apple SD Gothic Neo',-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; padding:0 18px 90px; }
  .top { display:flex; gap:8px; align-items:center; padding:16px 0 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:10; }
  .top a { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:10px; padding:9px 14px; font-size:14px; font-weight:600; text-decoration:none; }
  .top a:hover { background:var(--accent); color:#fff; }
  header { border-bottom:2px solid var(--accent); padding:18px 0; }
  .kicker { font-size:12px; letter-spacing:1.5px; color:var(--accent); font-weight:700; text-transform:uppercase; }
  h1 { font-size:27px; margin:8px 0 6px; line-height:1.3; }
  .sub { color:var(--kr); font-size:14px; }
  .card { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px; margin:12px 0; }
  .go { flex:1; text-decoration:none; color:var(--ink); display:block; }
  .go:hover .title { color:var(--accent); }
  .date { font-size:13px; font-weight:700; color:var(--accent); }
  .title { font-size:17px; font-weight:600; margin-top:2px; }
  .del { flex:0 0 42px; height:42px; border:none; background:transparent; color:#e0a400; font-size:24px; cursor:pointer; line-height:1; }
  .del:hover { transform:scale(1.15); }
  .empty { text-align:center; color:var(--kr); padding:60px 20px; font-size:15px; }
  @media (max-width:520px) { h1 { font-size:22px; } .title { font-size:16px; } }
</style></head><body><div class="wrap">
<div class="top"><a href="index.html">&#8592; 학습 페이지</a></div>
<header>
  <div class="kicker">EBS 모닝스페셜 · News Coverage</div>
  <h1>&#9733; 즐겨찾기 모음</h1>
  <div class="sub">학습 페이지에서 날짜별 ★ 즐겨찾기 버튼을 눌러 저장한 방송이 여기에 모입니다.</div>
</header>
<div id="list"></div>
</div>
<script>
const FAV_KEY='ebs_ms_fav_days';
function getFavDays(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
function setFavDays(v){ localStorage.setItem(FAV_KEY, JSON.stringify(v)); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function render(){
  const favs=getFavDays().slice().sort((a,b)=>(b.slug||'').localeCompare(a.slug||''));
  const list=document.getElementById('list');
  if(!favs.length){ list.innerHTML='<div class="empty">아직 저장한 날짜가 없습니다.<br>학습 페이지에서 날짜별 ★ 즐겨찾기 버튼을 눌러 보세요.</div>'; return; }
  let html='';
  favs.forEach(f=>{
    html+='<div class="card">'
      +'<a class="go" href="index.html#'+esc(f.slug)+'">'
      +'<div class="date">'+esc(f.date)+'</div>'
      +'<div class="title">'+esc(f.title_en)+'</div>'
      +'</a>'
      +'<button class="del" data-slug="'+esc(f.slug)+'" aria-label="삭제">&#9733;</button>'
      +'</div>';
  });
  list.innerHTML=html;
  document.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{
    setFavDays(getFavDays().filter(f=>f.slug!==b.dataset.slug));
    render();
  }));
}
render();
</script></body></html>
