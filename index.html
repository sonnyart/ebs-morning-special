<style>
  :root { --accent:#8a6d3b; --bg:#faf6ef; --card:#fff; --ink:#241f17; --kr:#6b6356; --line:#ece3d3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans KR','Apple SD Gothic Neo',-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; padding:0 18px 90px; }
  .picker { display:flex; gap:8px; align-items:center; padding:16px 0 10px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:10; border-bottom:1px solid var(--line); }
  .picker select { flex:1; min-width:150px; padding:9px 12px; border:1px solid var(--accent); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; font-family:inherit; }
  .picker button { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:10px; padding:9px 12px; font-size:14px; cursor:pointer; font-weight:600; }
  .picker button:hover:not(:disabled) { background:var(--accent); color:#fff; }
  .picker button:disabled { opacity:.35; cursor:default; }
  header { border-bottom:2px solid var(--accent); padding:18px 0; }
  .kicker { font-size:12px; letter-spacing:1.5px; color:var(--accent); font-weight:700; text-transform:uppercase; }
  h1 { font-size:27px; margin:8px 0 6px; line-height:1.3; }
  .byline { color:var(--kr); font-size:14px; }
  .fav { flex:0 0 42px; height:42px; border:none; background:transparent; color:#c9a86a; font-size:24px; cursor:pointer; line-height:1; padding:0; }
  .fav:hover { transform:scale(1.18); color:#e0a400; }
  .fav.on { color:#e0a400; }
  .favlink { margin-left:auto; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:9px 15px; font-size:14px; font-weight:600; text-decoration:none; }
  .favlink:hover { background:var(--accent); color:#fff; }
  .item { display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:12px; }
  .play { flex:0 0 44px; height:44px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; transition:transform .1s; }
  .play:hover { transform:scale(1.08); }
  .play.playing { background:#2e7d5b; }
  .play.paused { background:#c98a2b; }
  .text { flex:1; }
  .num { font-size:11px; font-weight:700; color:var(--accent); margin-right:6px; }
  .en { font-size:17px; font-weight:500; margin-bottom:4px; }
  .kr { color:var(--kr); font-size:15px; }
  .foot { text-align:center; color:var(--kr); font-size:12px; margin-top:30px; }
  .foot a { color:var(--accent); }
  @media (max-width:520px) { h1 { font-size:22px; } .en { font-size:16px; } .wrap { padding:0 14px 70px; } }

</div><script>
const DAYS = [{"slug": "2026-10-19", "date": "2026.10.19. Mon.", "title_en": "Cancer Vaccines Are the NIH’s Next ‘Big Bet’", "author": "Gina Kolata", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364441?hmpMnuId=101", "sentences": [{"en": "A new type of cancer treatment — vaccines — is so promising that it demands a national effort to expedite discoveries, said the director of the National Cancer Institute, Dr. Anthony Letai.", "kr": "암 치료의 새로운 유형인 백신이 매우 유망해서, 발견을 앞당기기 위한 국가적 노력이 필요하다고 국립암연구소(NCI) 소장인 앤서니 레타이(Anthony Letai) 박사가 말했습니다."}, {"en": "“We can do things that would not otherwise be done,” he said of new resources being made available at the National Institutes of Health.", "kr": "국립보건원(NIH)에서 새로 마련되는 자원에 대해 그는 “그렇지 않았다면 할 수 없었을 일들을 해낼 수 있습니다”라고 말했습니다."}, {"en": "“We can place big bets on new ideas.”", "kr": "“새로운 아이디어에 과감하게 베팅할 수 있습니다.”"}, {"en": "The big bet is a planned public-private partnership involving the NIH, the nonprofit Foundation for the NIH, researchers, pharmaceutical and biotech companies, advocacy groups, philanthropies and patients, all working together to develop and test the vaccines.", "kr": "이 큰 베팅은 NIH, 비영리 단체인 NIH 재단, 연구자들, 제약·바이오 기업들, 옹호 단체들, 자선 단체들, 환자들이 모두 함께 백신을 개발하고 시험하기 위해 협력하는, 계획된 민관 파트너십입니다."}, {"en": "The vaccines are treatments that are unique to each patient by prompting the immune system to attack a patient’s specific cancer.", "kr": "이 백신은 면역 체계가 각 환자의 특정 암을 공격하도록 유도함으로써, 환자마다 고유하게 맞춰지는 치료법입니다."}, {"en": "The injections teach the immune systems’s T cells to home in on aberrant proteins found on a patient’s tumor and nowhere else.", "kr": "이 주사는 면역 체계의 T세포가 환자의 종양에서만 발견되고 다른 곳에서는 발견되지 않는 비정상 단백질을 겨냥하도록 훈련시킵니다."}, {"en": "“We hope this will be like COVID vaccines,” said Stacey Adam, a senior clinical officer at the Foundation for the NIH, referring to the public-private partnership that led to the rapid development of vaccines for the coronavirus.", "kr": "NIH 재단의 선임 임상 책임자인 스테이시 애덤(Stacey Adam)은 코로나바이러스 백신의 신속한 개발을 이끌었던 민관 파트너십을 언급하며 “우리는 이것이 코로나 백신처럼 되길 바랍니다”라고 말했습니다."}, {"en": "She said the vaccine program was expected to begin in December, starting with a focus on pancreatic cancer, liver cancer and colorectal cancer, as well as a subset of pediatric tumors.", "kr": "그녀는 백신 프로그램이 12월에 시작될 예정이며, 췌장암·간암·대장암과 더불어 일부 소아 종양 유형에 초점을 맞추는 것으로 시작할 것이라고 말했습니다."}, {"en": "The project is still a bet: There is no guarantee that the early promise of cancer vaccines will pay off.", "kr": "이 프로젝트는 여전히 하나의 베팅입니다. 암 백신의 초기 가능성이 성과로 이어질 것이라는 보장은 없습니다."}, {"en": "The history of medicine is littered with tales of treatments that seemed incredible in early studies only to fail in larger tests.", "kr": "의학의 역사에는 초기 연구에서 놀랍게 보였다가 더 큰 규모의 시험에서 결국 실패한 치료법에 관한 이야기가 널려 있습니다."}, {"en": "Yet enthusiasm for the vaccines is running high.", "kr": "그럼에도 불구하고 이 백신에 대한 열기는 크게 고조되어 있습니다."}, {"en": "“This is a completely new frontier,” said Karen Knudsen, CEO of the Parker Institute.", "kr": "“이것은 완전히 새로운 개척 분야입니다”라고 파커 연구소(Parker Institute)의 CEO인 캐런 크누드슨(Karen Knudsen)은 말했습니다."}, {"en": "The institute has two representatives working with the NIH initiative and is also funding vaccine studies, positioning them as one of its main priorities.", "kr": "이 연구소는 NIH 이니셔티브와 함께 일하는 두 명의 대표를 두고 있으며, 백신 연구에도 자금을 지원하면서 이를 주요 우선순위 중 하나로 삼고 있습니다."}, {"en": "So far, just one vaccine study has been large enough to show definitive results.", "kr": "지금까지 확정적인 결과를 보여줄 만큼 규모가 컸던 백신 연구는 단 하나뿐입니다."}, {"en": "It involved 1,137 people with advanced melanoma.", "kr": "그 연구에는 진행성 흑색종 환자 1,137명이 참여했습니다."}, {"en": "Merck and Moderna, which conducted the study, reported in August that the vaccine increased the time before cancers recurred and increased the time before they spread.", "kr": "이 연구를 수행한 머크(Merck)와 모더나(Moderna)는 8월에 이 백신이 암이 재발하기까지의 시간과 암이 퍼지기까지의 시간을 모두 늘렸다고 보고했습니다."}, {"en": "The companies plan to reveal the full data set later this month.", "kr": "두 회사는 이달 말에 전체 데이터 세트를 공개할 계획입니다."}, {"en": "Adam was optimistic: “The science is there, the technologies are there,” she said.", "kr": "애덤은 낙관적이었습니다. “과학도 이미 있고, 기술도 이미 있습니다”라고 그녀는 말했습니다."}, {"en": "“Everything is coming to a head,” she added.", "kr": "“모든 것이 무르익고 있습니다”라고 그녀는 덧붙였습니다."}, {"en": "“Now is the time to jump-start.”", "kr": "“지금이 바로 본격적으로 추진해야 할 때입니다.”"}, {"en": "That initial study, though — promising as it was — was not definitive.", "kr": "하지만 그 최초의 연구는 유망하기는 했지만 결정적이지는 않았습니다."}, {"en": "“We cannot prove that vaccines are making patients live longer,” Balachandran said.", "kr": "“우리는 백신이 환자의 수명을 늘리고 있다는 것을 증명할 수 없습니다”라고 발라찬드란(Balachandran)은 말했습니다."}, {"en": "His group and its industry partners began a much bigger study in 2023, enrolling 260 patients.", "kr": "그의 연구팀과 업계 파트너들은 2023년에 260명의 환자를 등록한 훨씬 더 큰 규모의 연구를 시작했습니다."}, {"en": "Based on what he has seen so far, Balachandran is hopeful about the future of vaccine therapy.", "kr": "지금까지 본 결과를 바탕으로, 발라찬드란은 백신 요법의 미래에 대해 희망을 갖고 있습니다."}, {"en": "With pancreatic cancer, he took on a cancer thought to be impervious to immune system attacks: “If we crack the toughest nut,” he said, “we can crack the rest.”", "kr": "췌장암의 경우, 그는 면역 체계의 공격에 영향받지 않는다고 여겨졌던 암에 도전했습니다. “가장 어려운 문제를 풀 수 있다면 나머지도 풀 수 있습니다”라고 그는 말했습니다."}]}, {"slug": "2026-10-16", "date": "2026.10.16. Fri.", "title_en": "The Very Online Push for Snail Mail", "author": "Maria Santa Poggi", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364171?hmpMnuId=101", "sentences": [{"en": "In late June, the content creator Em-J Staples posted an open call on TikTok to play matchmaker for anyone who wanted a \"summer buddy\" pen pal.", "kr": "6월 말, 콘텐츠 크리에이터 엠제이 스테이플스(Em-J Staples)는 '여름 친구' 펜팔을 원하는 사람에게 짝을 찾아주겠다며 틱톡에 공개 모집 글을 올렸습니다."}, {"en": "\"I had a pen pal in Girl Scouts growing up,\" said Staples, 37, and, as a millennial and a mother to a 1-year-old and a 3-year-old, \"I want to relive my summers with them.\"", "kr": "\"어렸을 때 걸스카우트에서 펜팔 친구가 있었어요\"라고 37세의 스테이플스는 말했습니다. 밀레니얼 세대이자 1살과 3살 아이의 엄마인 그는 \"아이들과 함께 여름을 다시 보내고 싶어요\"라고 덧붙였습니다."}, {"en": "\"I was nostalgic for a '90s summer,\" she added.", "kr": "\"90년대의 여름이 그리웠어요\"라고 그녀는 덧붙였습니다."}, {"en": "The San Francisco Bay Area resident didn't anticipate going viral, but she received over 330,000 views over the following few weeks, with 14,000 individuals signing up either for email or snail mail correspondence.", "kr": "샌프란시스코 베이 에어리어에 사는 그녀는 화제가 될 줄은 예상하지 못했지만, 이후 몇 주 동안 33만 회 이상의 조회수를 기록했고, 이메일이나 일반 우편(스네일 메일)으로 편지를 주고받겠다고 신청한 사람이 1만 4천 명에 달했습니다."}, {"en": "She paired pen pals through a compatibility questionnaire she had made on Google Forms.", "kr": "그녀는 구글 폼으로 직접 만든 궁합 설문지를 통해 펜팔을 짝지어 주었습니다."}, {"en": "As of late, zillennials have been finding delight — and refuge from a complicated world — in all that exudes \"whimsy,\" a word that is now internet shorthand to characterize playful and spontaneous lifestyle choices.", "kr": "최근 들어 질레니얼(밀레니얼과 Z세대 사이에 낀 세대)은 '기발함(whimsy)'을 풍기는 모든 것에서 즐거움과 복잡한 세상으로부터의 피난처를 찾고 있는데, 이 단어는 이제 장난기 있고 즉흥적인 라이프스타일 선택을 가리키는 인터넷 약어가 되었습니다."}, {"en": "(Related: going Luddite, all things analog and \"grandma hobbies.\")", "kr": "(관련어: 러다이트 되기, 모든 아날로그적인 것, 그리고 '할머니 취미'.)"}, {"en": "As 2026 would have it, posting offline hobbies has become content of its own: \"Both of us consistently post videos of sending each other letters,\" said Ensing, who has over 24k followers on TikTok; Simme has nearly 18k.", "kr": "2026년이라는 시대가 보여주듯, 오프라인 취미를 게시하는 것 자체가 콘텐츠가 되었습니다. \"우리 둘 다 서로에게 편지를 보내는 영상을 꾸준히 올려요\"라고 틱톡 팔로워 2만 4천 명이 넘는 엔싱(Ensing)이 말했고, 시메(Simme)는 약 1만 8천 명의 팔로워를 보유하고 있습니다."}, {"en": "Ensing attributes the resurgence to a collective craving for personal connections that build gradually over time, and often that means not feeling pressure to meet in real life.", "kr": "엔싱은 이런 부활이 시간이 지나며 서서히 쌓이는 개인적 연결에 대한 집단적 갈망 덕분이라고 보며, 이는 곧 실제로 만나야 한다는 부담감을 느끼지 않아도 된다는 뜻이기도 합니다."}, {"en": "Sophia Hue, 21, a college senior in Idaho, has two pen pals she connected with over social media and with whom she's been corresponding for eight months.", "kr": "아이다호주의 대학 4학년인 21세의 소피아 휴(Sophia Hue)는 소셜미디어를 통해 만나 8개월째 편지를 주고받아 온 펜팔 친구가 두 명 있습니다."}, {"en": "\"We don't have a set time when we need to respond to each other,\" she said.", "kr": "\"우리는 서로 답장해야 하는 정해진 시간이 없어요\"라고 그녀는 말했습니다."}, {"en": "\"There's a comfort element that you don't have to see them face to face.\"", "kr": "\"얼굴을 마주 보지 않아도 된다는 편안함이 있어요.\""}, {"en": "There is no one way to best find a pen pal.", "kr": "펜팔을 찾는 데 최선의 단 하나의 방법은 없습니다."}, {"en": "Some do it in social media comments sections, posting to their Story or, like Hue in the case of one pen pal, taking a risk and reaching out through DMs.", "kr": "어떤 사람들은 소셜미디어 댓글란에서 하거나, 자신의 스토리에 올리거나, 아니면 휴(Hue)가 펜팔 한 명의 경우처럼 과감하게 DM으로 먼저 연락을 시도하기도 합니다."}, {"en": "\"It's not necessarily about moving away from technology,\" said Agus Panzoni, the head of culture strategy at the trend and media platform Death To Stock (DTS).", "kr": "\"반드시 기술에서 벗어나는 것이 중요한 건 아니에요\"라고 트렌드·미디어 플랫폼 데스 투 스톡(DTS)의 문화 전략 책임자 아구스 판조니(Agus Panzoni)는 말했습니다."}, {"en": "\"It's about moving away from a format of communication that is mediated by platforms and digital systems that optimize speed, convenience and infinite access.\"", "kr": "\"속도, 편의성, 무한한 접근성을 최적화하는 플랫폼과 디지털 시스템이 매개하는 소통 방식에서 벗어나는 것이 중요하죠.\""}, {"en": "According to Panzoni, having a pen pal has steadily been on the rise since 2020, which is also when matchmakers started popping up.", "kr": "판조니에 따르면 펜팔을 갖는 것은 2020년 이후 꾸준히 증가해 왔는데, 그 시기는 바로 펜팔을 짝지어 주는 중매인들이 등장하기 시작한 때이기도 합니다."}, {"en": "\"We were already seeing the rise of pen pal matching services on TikTok through the comment sections happening during the pandemic,\" she said.", "kr": "\"팬데믹 기간에 틱톡 댓글란을 통해 펜팔 매칭 서비스가 생겨나는 것을 이미 목격하고 있었어요\"라고 그녀는 말했습니다."}, {"en": "Previously, in the spring of 2020, Syme, who lives in Brooklyn and is in her early 40s, founded Penpalooza, a pen pal exchange that peaked at 15,000 subscribers.", "kr": "앞서 2020년 봄, 브루클린에 살고 40대 초반인 사임(Syme)은 구독자 1만 5천 명까지 늘어났던 펜팔 교환 서비스 '펜팔루자(Penpalooza)'를 설립했습니다."}, {"en": "Currently, she matches correspondents through her DMs since noticing people's continued hunger for letter exchanges after the world opened up again.", "kr": "현재 그녀는 세상이 다시 열린 뒤에도 사람들이 편지 교환에 대한 꾸준한 갈망을 보인다는 점을 알아차리고, 자신의 DM을 통해 서신 상대를 연결해 주고 있습니다."}, {"en": "(Her first book, \"Syme's Letter Writer,\" published in 2025, is a guide to modern correspondence and letter-writing etiquette).", "kr": "(2025년에 출간된 그녀의 첫 책 《사임의 편지 쓰기(Syme's Letter Writer)》는 현대적 서신 왕래와 편지 예절에 대한 안내서입니다.)"}, {"en": "\"People feel really alienated from one another. There's no safe place to communicate where you're not doing it out in public,\" she said, referencing the loneliness epidemic, increasing backlash to AI and the digital surveillance state.", "kr": "\"사람들은 서로에게서 정말 소외감을 느낍니다. 공개된 공간이 아닌 곳에서는 안전하게 소통할 수 있는 장소가 전혀 없어요\"라고 그녀는 외로움 유행병, AI에 대한 커져가는 반발, 그리고 디지털 감시 국가를 언급하며 말했습니다."}, {"en": "\"The mail,\" she added, \"feels sacred.\"", "kr": "\"우편물은\" 그녀가 덧붙였습니다. \"신성하게 느껴져요.\""}]}, {"slug": "2026-10-15", "date": "2026.10.15. Thu.", "title_en": "At 194, Jonathan the Giant Tortoise Knows About Aging", "author": "Monique Brouillette", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364024?hmpMnuId=101", "sentences": [{"en": "In June, after Jonathan was erroneously declared dead by some media organizations, the Guinness World Records added him to its list of global icons, honoring his superlative status.", "kr": "6월에 일부 언론 매체가 조너선이 죽었다고 잘못 발표한 뒤, 기네스 세계기록은 그의 최고의 위상을 기리며 그를 '글로벌 아이콘' 목록에 추가했습니다."}, {"en": "And Wednesday, he reached another milestone when a study announced that his genome had been sequenced for the first time.", "kr": "그리고 수요일, 한 연구가 그의 게놈이 처음으로 해독되었다고 발표하면서 그는 또 하나의 이정표에 도달했습니다."}, {"en": "\"We almost never get to study an animal this old while it is still alive,\" said Steve Horvath, a biologist who studies aging at the UCLA, and an author of the study, which was published in the journal Science Advances.", "kr": "UCLA에서 노화를 연구하는 생물학자이자 학술지 《사이언스 어드밴시스》에 발표된 이 연구의 저자인 스티브 호바스는 \"이렇게 오래 산 동물을 살아 있는 동안 연구할 기회는 거의 없습니다\"라고 말했습니다."}, {"en": "After sequencing the sample, the scientists compared Jonathan's genome with those of tortoises 100 years his junior and found some molecular differences, especially in genes involved with DNA repair and the maintenance of the protective caps on chromosomes, called telomeres.", "kr": "샘플의 배열 순서를 밝힌 뒤, 과학자들은 조너선의 게놈을 그보다 100년 더 어린 거북들의 게놈과 비교했고, 특히 DNA 복구와 텔로미어라고 불리는 염색체 보호 캡의 유지에 관여하는 유전자에서 분자 수준의 차이를 발견했습니다."}, {"en": "As organisms age, DNA accumulates damage and the telomeres shorten, a process thought to drive aging.", "kr": "생명체가 나이 들수록 DNA에는 손상이 축적되고 텔로미어는 짧아지는데, 이 과정이 노화를 이끄는 것으로 여겨집니다."}, {"en": "The results hint that this species may have evolved to be more resilient to age-related decline, but further testing is needed.", "kr": "이 결과는 이 종이 노화에 따른 쇠퇴에 더 잘 견디도록 진화했을 수 있음을 시사하지만, 추가 검증이 필요합니다."}, {"en": "The team also discovered that Jonathan shared some genes with other long-living species like naked mole rats, which can live to 40 and rarely get cancer.", "kr": "연구팀은 또한 조너선이 40년까지 살 수 있고 암에 거의 걸리지 않는 벌거숭이두더지쥐 같은 다른 장수 종들과 일부 유전자를 공유한다는 사실도 발견했습니다."}, {"en": "Perhaps most interesting is what they found when they looked at the tortoise's epigenome, which is a map of the chemical tags that regulate the genome.", "kr": "아마도 가장 흥미로운 것은 게놈을 조절하는 화학적 표지의 지도인 후성유전체(에피게놈)를 살펴봤을 때 발견한 내용입니다."}, {"en": "These tags change with age and can lead to erratic gene activity.", "kr": "이 표지들은 나이가 들면서 변하며 불규칙한 유전자 활동을 초래할 수 있습니다."}, {"en": "As expected, Jonathan had age-related changes in his epigenome similar to older humans, but there was an exception.", "kr": "예상대로 조너선은 나이 든 인간과 유사한 후성유전체의 연령 관련 변화를 보였지만, 한 가지 예외가 있었습니다."}, {"en": "Notably, the control switches linked to mitochondria were well preserved, similar to those of a young tortoise.", "kr": "특히 미토콘드리아와 연결된 조절 스위치는 젊은 거북의 것과 비슷하게 잘 보존되어 있었습니다."}, {"en": "Mitochondria, the molecular power plants inside cells, have long been linked to healthy aging.", "kr": "세포 내부의 분자 발전소인 미토콘드리아는 오랫동안 건강한 노화와 연결되어 왔습니다."}, {"en": "The potential for learning from the biology of animals that live extraordinarily long lives is exciting for scientists who study aging.", "kr": "비범하게 오래 사는 동물들의 생물학에서 배울 수 있는 가능성은 노화를 연구하는 과학자들에게 매우 흥미로운 일입니다."}, {"en": "\"Each of these long-lived species has some kind of special trick,\" said Steve Austad, a biologist at the University of Alabama at Birmingham.", "kr": "앨라배마대학교 버밍엄의 생물학자 스티브 오스태드는 \"이런 장수 종들은 저마다 어떤 특별한 비결을 가지고 있습니다\"라고 말했습니다."}, {"en": "\"And some of those may turn out to be relevant to human aging.\"", "kr": "\"그리고 그중 일부는 인간의 노화와 관련이 있는 것으로 밝혀질 수도 있습니다.\""}, {"en": "\"The results integrate very well in the wider puzzle of what longevity is,\" said Björn Schumacher, who studies aging at the University of Cologne in Germany.", "kr": "독일 쾰른대학교에서 노화를 연구하는 비에른 슈마허는 \"이 결과는 장수가 무엇인지에 대한 더 큰 퍼즐에 아주 잘 들어맞습니다\"라고 말했습니다."}, {"en": "He urged caution, though, in concluding that Jonathan would help us understand why humans age and what we can do about it.", "kr": "하지만 그는 조너선이 인간이 왜 노화하는지, 그리고 우리가 그에 대해 무엇을 할 수 있는지를 이해하는 데 도움이 될 것이라고 결론 내리는 데에는 신중할 것을 당부했습니다."}, {"en": "Jonathan's advanced age could be an outlier because of his round-the-clock veterinary care, diet of fresh vegetables and protected lawn at the governor's house.", "kr": "조너선의 고령은 24시간 수의학적 돌봄, 신선한 채소 식단, 그리고 총독 관저의 보호받는 잔디밭 덕분에 예외적인 사례일 수 있습니다."}, {"en": "The molecular results offer tantalizing clues, however — ones that scientists are keen to explore further.", "kr": "하지만 분자 수준의 결과는 과학자들이 더 탐구하고 싶어 하는 감질나는 단서를 제공합니다."}, {"en": "\"If we had 1,000 animals like Jonathan, it would be easier to understand his longevity,\" said Stephen Clark, lead author of the study and the founder of Kallel, a nonprofit dedicated to studying the genetics of aging.", "kr": "이 연구의 주저자이자 노화 유전학 연구에 전념하는 비영리 단체 칼렐(Kallel)의 설립자인 스티븐 클라크는 \"조너선 같은 동물이 1,000마리만 있다면 그의 장수를 이해하기가 더 쉬울 것입니다\"라고 말했습니다."}, {"en": "In the future, Clark hopes to analyze more Aldabra tortoises and other long-lived species by gathering data that offers some hints for us spry chickens, too.", "kr": "앞으로 클라크는 더 많은 알다브라거북과 다른 장수 종들을 분석해, 우리처럼 상대적으로 짧게 사는 '활기찬 햇병아리'인 인간에게도 몇 가지 단서를 주는 데이터를 수집하기를 희망합니다."}]}, {"slug": "2026-10-14", "date": "2026.10.14. Wed.", "title_en": "Juniper Lattes? Pine Sodas? Food Is Taking Us Back to the Forest.", "author": "Kim Severson", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363771?hmpMnuId=101", "sentences": [{"en": "America's walk into the woods follows an era dominated by international flavors and tropical tastes like dragonfruit, the warm bakery vibe of Generation Z's \"little treats\" culture and the sweet-spicy mashup that birthed a thousand hot honey pizzas.", "kr": "미국이 숲으로 향하는 움직임은 용과 같은 국제적인 풍미와 열대의 맛, Z세대의 '작은 기쁨' 문화에서 비롯된 따뜻한 베이커리 분위기, 그리고 수많은 핫 허니 피자를 탄생시킨 달콤하면서도 매콤한 조합이 지배하던 시대를 뒤따른 것입니다."}, {"en": "\"Now we're starting to see increased interest in flavors that might be about the place, the origin, the landscape or even craftsmanship,\" said Sally Lyons Wyatt, the head of consumer goods and food service at Circana, a global market research and data analytics firm.", "kr": "글로벌 시장조사·데이터분석 기업 서카나(Circana)의 소비재·외식 서비스 부문 책임자인 샐리 라이언스 와이어트는 \"이제 우리는 장소, 원산지, 풍경, 심지어 장인정신에 관한 풍미에 대한 관심이 커지는 것을 보기 시작했습니다\"라고 말했습니다."}, {"en": "\"Consumers increasingly want flavors that evoke nature, foraging and the outdoors.\"", "kr": "\"소비자들은 자연, 채집, 그리고 야외 활동을 떠올리게 하는 풍미를 점점 더 원하고 있습니다.\""}, {"en": "Humans are hard-wired to be physically rewarded by contact with soil and plant life, she said.", "kr": "인간은 흙과 식물을 접촉할 때 신체적으로 보상을 받도록 본능적으로 설계되어 있다고 그녀는 말했습니다."}, {"en": "Flavors from the natural world tap into that, offering an antidote to unsettling digital transformation, climate change and global political conflict.", "kr": "자연 세계에서 온 풍미는 그것을 활용하여, 불안한 디지털 전환과 기후 변화, 그리고 전 세계적인 정치적 갈등에 대한 해독제 역할을 합니다."}, {"en": "A summer of food recalls and, she added, the rise of the Make America Healthy Again movement with its emphasis on natural remedies also fuel the attraction.", "kr": "그녀는 또한 식품 리콜이 잇따랐던 여름과, 자연 요법을 강조하는 '메이크 아메리카 헬시 어게인' 운동의 부상도 이러한 매력을 부추기고 있다고 덧붙였습니다."}, {"en": "Stephanie Mattucci, the principal food and drink strategist for the global food research firm Mintel, sees parallels to the Industrial Revolution and the Gilded Age, when Swiss author Johanna Spyri published \"Heidi.\"", "kr": "글로벌 식품 조사 기업 민텔(Mintel)의 수석 식음료 전략가 스테파니 마투치는 스위스 작가 요한나 슈피리가 《하이디》를 출간했던 산업혁명과 도금시대와의 유사점을 발견합니다."}, {"en": "The story of a young girl who escapes city life to seek solace living in the mountains with her grandfather was a bestseller in the United States, and remains a classic.", "kr": "도시 생활에서 벗어나 할아버지와 함께 산에서 살며 위안을 찾는 어린 소녀의 이야기는 미국에서 베스트셀러였고, 지금도 고전으로 남아 있습니다."}, {"en": "\"In this moment of great change and technological revolution, how can we ground ourselves?\" Mattucci said.", "kr": "\"이 거대한 변화와 기술 혁명의 순간에, 우리는 어떻게 중심을 잡을 수 있을까요?\"라고 마투치는 말했습니다."}, {"en": "\"People are attracted to alpine flavors as a way to step away from overstimulation and into the therapeutic benefit of the forest and the trees and mountains.\"", "kr": "\"사람들은 과도한 자극에서 벗어나 숲과 나무와 산이 주는 치유의 혜택으로 들어가기 위한 방법으로 알프스 풍미에 끌립니다.\""}, {"en": "Andrea Ramirez, Torani's trends and insight manager, said the company took note of the growing popularity of kombucha, matcha and the bitter undertones of an Aperol spritz, as well as Nordic influences like the Danish comfort concept called hygge and an increase in travel to the Dolomites and the Alps.", "kr": "토라니(Torani)의 트렌드·인사이트 매니저인 안드레아 라미레스는 회사가 콤부차와 말차, 그리고 아페롤 스프리츠의 쌉싸름한 뒷맛의 인기 상승뿐 아니라, 덴마크의 편안함 개념인 '휘게(hygge)' 같은 북유럽의 영향과 돌로미티·알프스 여행의 증가에도 주목했다고 말했습니다."}, {"en": "The piney syrup was infused with ginger and sage so it wouldn't remind anyone of a cleaning product, Ramirez said.", "kr": "솔 향 시럽에는 생강과 세이지를 넣어 세정제를 연상시키지 않도록 했다고 라미레스는 말했습니다."}, {"en": "The idea was to offer a trip to the forest in a cup.", "kr": "그 아이디어는 한 잔에 담긴 숲으로의 여행을 선사하는 것이었습니다."}, {"en": "\"If you live in the middle of the city,\" she said, \"you might not have access to clean forests of pine trees.\"", "kr": "\"도시 한복판에 산다면,\" 그녀는 말했습니다. \"깨끗한 소나무 숲을 접할 기회가 없을 수도 있습니다.\""}, {"en": "All the trend-spotter talk of \"mushroom-adjacent flavors\" and \"alpine cues\" is only partly about taking refuge from societal mayhem in the cool forest.", "kr": "트렌드를 읽는 이들이 말하는 '버섯에 가까운 풍미'와 '알프스 신호'라는 이야기는 단지 시원한 숲에서 사회적 혼란을 피해 대피하려는 것만은 아닙니다."}, {"en": "It's also about marketing and the nature of the American consumer.", "kr": "그것은 또한 마케팅과 미국 소비자의 본성에 관한 것이기도 합니다."}, {"en": "\"Part of it, to be sure, is the relentless pursuit of novelty,\" said Helen Zoe Veit, a professor of history at Michigan State University who has written two books about the nation's food.", "kr": "\"물론 그중 일부는 새로움을 향한 끊임없는 추구입니다\"라고, 미국 음식에 관한 책 두 권을 쓴 미시간주립대 역사학 교수 헬렌 조 비트는 말했습니다."}, {"en": "\"And then there is just copying other people for no other reason than everyone else is drinking green matcha or a pine-flavored soda, so I might as well have one, too.\"", "kr": "\"그리고 다른 사람들이 모두 그린 말차나 솔 향 소다를 마시고 있다는 이유 말고는 다른 이유 없이 그저 남을 따라 하는 것도 있습니다. 그래서 나도 한 잔 마셔 보는 게 낫겠다 싶은 거죠.\""}]}, {"slug": "2026-10-13", "date": "2026.10.13. Tue.", "title_en": "Forget Quiet Luxury. In Ancient Rome, the Fashion Was Loud.", "author": "Nicolas Liney", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363383?hmpMnuId=101", "sentences": [{"en": "As Rome consolidated its control over the Mediterranean and beyond in the early centuries of the first millennium, a thriving trade network fueled an increasingly consumerist society.", "kr": "로마가 첫 천년기 초반 몇 세기 동안 지중해와 그 너머에 대한 지배권을 공고히 해 나가면서, 번성하던 무역 네트워크는 점점 더 소비 지향적인 사회를 부추겼습니다."}, {"en": "Fashion trends and materials, like silk, pearls and dyes, flowed in from encounters with other cultures and helped demarcate social hierarchies in Rome.", "kr": "실크, 진주, 염료 같은 패션 트렌드와 재료들은 다른 문화와의 교류를 통해 유입되어, 로마의 사회적 위계를 구분 짓는 데 기여했습니다."}, {"en": "The more exotic or rarefied your outfit was, the more clout you carried.", "kr": "복장이 더 이국적이거나 귀할수록, 그만큼 더 큰 영향력을 지녔습니다."}, {"en": "Textiles decay easily, and hard evidence for Roman fashion is vanishingly rare.", "kr": "직물은 쉽게 썩기 때문에, 로마 패션에 대한 확실한 증거는 극히 드뭅니다."}, {"en": "But Roman portrait sculpture can tell us a lot about clothing, hairstyles and jewelry — even what perfumes people used.", "kr": "하지만 로마의 초상 조각은 의복, 헤어스타일, 장신구에 대해 많은 것을 알려 줍니다 — 심지어 어떤 향수를 썼는지까지도요."}, {"en": "And because these statues broadcast idealized versions of their subjects, they reveal even more about how people wanted to be seen.", "kr": "그리고 이 조각상들은 대상 인물의 이상화된 모습을 널리 보여 주는 것이기에, 사람들이 어떻게 보이고 싶어 했는지를 한층 더 잘 드러냅니다."}, {"en": "Perhaps predictably, many sculptures in the exhibition feature a subject wearing a toga or a stola, a sort of pinafore for women.", "kr": "어쩌면 예상대로, 전시의 많은 조각상들은 토가나 여성용 원피스형 앞치마라 할 수 있는 스톨라를 입은 인물을 묘사하고 있습니다."}, {"en": "These garments, which telegraphed Roman citizenship, remained remarkably unchanged over the centuries.", "kr": "로마 시민권을 드러내는 이 의복들은 수 세기 동안 놀라울 정도로 변함없이 유지되었습니다."}, {"en": "But ornaments, hairstyles and dyes offered a way of standing out.", "kr": "그러나 장신구, 헤어스타일, 염료는 남들과 구별되는 수단을 제공했습니다."}, {"en": "Many of the statues were originally painted in vibrant pigments, although barely any trace is left today.", "kr": "많은 조각상들은 원래 선명한 색소로 채색되어 있었지만, 오늘날에는 그 흔적이 거의 남아 있지 않습니다."}, {"en": "The Glyptotek, a major center for research on the use of color in ancient sculpture, has used paint residue analysis to produce digital reconstructions displayed on screens in the show.", "kr": "고대 조각의 색채 사용 연구에서 주요 중심지인 글립토테크 미술관은 페인트 잔여물 분석을 활용해, 전시장 화면에 표시되는 디지털 복원 영상을 제작했습니다."}, {"en": "Dyes for garments were sourced from around the empire.", "kr": "의복용 염료는 제국 전역에서 조달되었습니다."}, {"en": "Purple — the most prestigious — was traditionally restricted to the garments of the elite.", "kr": "가장 권위 있는 색인 보라색은 전통적으로 엘리트 계층의 의복에만 쓰이도록 제한되었습니다."}, {"en": "The best purples came from the glands of Murex sea snails from the eastern Mediterranean, an exploitative practice that nearly drove the species to extinction.", "kr": "최고급 보라색은 동부 지중해산 무렉스 바다 달팽이의 분비샘에서 얻었는데, 이는 그 종을 거의 멸종으로 몰아간 착취적 관행이었습니다."}, {"en": "\"The word sustainability wouldn't make any sense to Romans,\" Broens said.", "kr": "\"지속가능성이라는 단어는 로마인들에게 아무 의미도 없었을 겁니다\"라고 브로엔스는 말했습니다."}, {"en": "Other dyes from imperial provinces were equally valuable and signified wealth, like kermes, a vermilion derived from insects, or saffron.", "kr": "제국의 속주들에서 온 다른 염료들도 마찬가지로 귀했고 부를 상징했는데, 곤충에서 추출한 주홍색 염료인 케르메스나 사프란이 그 예입니다."}, {"en": "These dyes were used for the clothes of wealthy citizens outside the Roman elite, including freed slaves, who were not allowed to wear purple.", "kr": "이 염료들은 보라색을 입는 것이 허용되지 않았던 해방 노예를 포함해, 로마 엘리트 계층 밖의 부유한 시민들의 옷에 사용되었습니다."}, {"en": "Other fashion trends, like hairstyles, could reflect Roman conquests.", "kr": "헤어스타일 같은 다른 패션 트렌드는 로마의 정복을 반영하기도 했습니다."}, {"en": "When Rome was struggling to subdue Germanic territories in the first century, elite women often wore wigs made from the blond hair of Germanic captives or tried to imitate the color with dye.", "kr": "로마가 1세기에 게르만 지역을 복속시키는 데 어려움을 겪고 있을 때, 엘리트 여성들은 게르만 포로의 금발 머리카락으로 만든 가발을 쓰거나, 염료로 그 색을 흉내 내려 했습니다."}, {"en": "In this case, Broens said, \"Women's beauty was quite literally constructed from subjugated peoples.\"", "kr": "이에 대해 브로엔스는 \"여성의 아름다움은 말 그대로 정복된 민족들로부터 만들어졌다\"고 말했습니다."}, {"en": "Yet not all foreign influences were harvested by force.", "kr": "하지만 모든 외래의 영향이 무력으로 거둬들여진 것은 아니었습니다."}, {"en": "As Rome's elite diversified, hairstyles were borrowed for cosmopolitan cachet.", "kr": "로마의 엘리트가 다양해지면서, 헤어스타일은 국제적인 위신을 얻기 위해 차용되었습니다."}, {"en": "Julia Domna, the wife of the emperor Septimius Severus, came from a powerful Syrian family, and her distinctive coiffure appears to have been a popular style in that region.", "kr": "셉티미우스 세베루스 황제의 아내인 율리아 돔나는 강력한 시리아 가문 출신이었고, 그녀의 독특한 머리 모양은 그 지역에서 유행하던 스타일이었던 것으로 보입니다."}, {"en": "A portrait bust in the exhibition displays the look, which was widely copied.", "kr": "전시에 나온 한 초상 흉상이 그 모습을 보여 주는데, 이 스타일은 널리 모방되었습니다."}, {"en": "We also know that perfume styles tracked the empire's expansion, with popular varieties including \"Egyptian\" and \"Assyrian.\"", "kr": "우리는 또한 향수 스타일이 제국의 확장을 따라갔다는 것을 아는데, 인기 있는 종류로는 \"이집트산\"과 \"아시리아산\"이 있었습니다."}, {"en": "Recent research shows that statues of the elite would even be regularly anointed with scents.", "kr": "최근 연구에 따르면, 엘리트의 조각상들에는 정기적으로 향을 발라 주기까지 했습니다."}, {"en": "Some recipes for scents survive, but we'll never know what they really smelled like.", "kr": "향에 대한 제조법 일부는 남아 있지만, 그것들이 실제로 어떤 향이었는지는 결코 알 수 없을 것입니다."}, {"en": "Instead, the Glyptotek invited Danish cosmetics brand Karmameju to create its own interpretations — bringing a touch of Scandinavian elegance to the imperial glitz.", "kr": "대신 글립토테크 미술관은 덴마크 화장품 브랜드 카르마메주를 초청해 나름의 해석을 만들게 했습니다 — 제국의 화려함에 스칸디나비아의 우아함을 한 스푼 더한 것이죠."}]}];
let idx = 0, rate = 1, current = null, currentBtn = null;
const view = document.getElementById('dayView');
const sel = document.getElementById('daySelect');

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function buildSelect(){
  DAYS.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=(i===0? d.date+'  (최신)' : d.date);
    sel.appendChild(o);
  });
}

const ICON_PLAY='&#9654;', ICON_PAUSE='&#10074;&#10074;';
const FAV_KEY='ebs_ms_favs';
function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
function setFavs(v){ localStorage.setItem(FAV_KEY, JSON.stringify(v)); }
function isFav(id){ return getFavs().some(f=>f.id===id); }
function toggleFav(d, n, btn){
  const id=d.slug+':'+n;
  let favs=getFavs();
  const i=favs.findIndex(f=>f.id===id);
  if(i>=0){ favs.splice(i,1); } else { favs.push({id:id, slug:d.slug, date:d.date, title_en:d.title_en, en:d.sentences[n-1].en, kr:d.sentences[n-1].kr, n:n}); }
  setFavs(favs);
  btn.innerHTML = i>=0 ? '&#9734;' : '&#9733;';
  btn.classList.toggle('on', i<0);
}
function resetBtns(){ document.querySelectorAll('.play').forEach(b=>{b.classList.remove('playing','paused'); b.innerHTML=ICON_PLAY;}); }
function stop(){
  document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0;});
  if(current)current.removeEventListener('ended',onEnded);
  current=null;currentBtn=null;resetBtns();
}
function onEnded(){
  if(currentBtn){currentBtn.classList.remove('playing','paused');currentBtn.innerHTML=ICON_PLAY;}
  current=null;currentBtn=null;
}
function toggle(i,btn){
  const a=document.getElementById('a'+i);
  if(!a)return;
  // 같은 문장: 재생 중이면 일시정지, 일시정지 상태면 이어서 재생
  if(current===a && !a.paused){ a.pause(); btn.classList.remove('playing'); btn.classList.add('paused'); btn.innerHTML=ICON_PLAY; return; }
  if(current===a && a.paused){ a.playbackRate=rate; a.play().catch(()=>{}); btn.classList.remove('paused'); btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE; return; }
  // 다른 문장: 정지 후 새로 재생
  stop();
  current=a;currentBtn=btn;a.playbackRate=rate;
  btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE;
  a.addEventListener('ended',onEnded);a.play().catch(()=>{});
}

function render(i, push){
  i=Math.max(0,Math.min(DAYS.length-1,i));
  stop();
  idx=i;
  const d=DAYS[i];
  const rows=d.sentences.map((s,n)=>'<div class="item">'
    +'<button class="play" data-i="'+(n+1)+'" aria-label="Play">&#9654;</button>'
    +'<div class="text"><div class="en"><span class="num">'+(n+1)+'.</span>'+esc(s.en)+'</div>'
    +'<div class="kr">'+esc(s.kr)+'</div></div>'
    +'<button class="fav" data-i="'+(n+1)+'" aria-label="즐겨찾기">&#9734;</button>'
    +'<audio id="a'+(n+1)+'" preload="none" src="audio/'+d.slug+'/s'+String(n+1).padStart(2,'0')+'.m4a"></audio>'
    +'</div>').join('');
  view.innerHTML='<header>'
    +'<div class="kicker">EBS 모닝스페셜 · News Coverage from The New York Times</div>'
    +'<h1>'+esc(d.title_en)+'</h1>'
    +'<div class="byline">'+esc(d.author)+' · '+esc(d.copyright)+' · '+esc(d.date)+'</div>'
    +'</header>'
    +rows
    +'<div class="foot">출처: EBS 최수진의 모닝스페셜 방송 내용 게시판 · <a href="'+esc(d.source_url)+'" target="_blank" rel="noopener">원문 보기</a><br>'
    +'본 텍스트는 학습용으로 정리한 것으로 원문과 다를 수 있습니다.</div>';

  view.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>toggle(parseInt(b.dataset.i),b)));
  view.querySelectorAll('.fav').forEach(b=>{
    const n=parseInt(b.dataset.i);
    const on=isFav(d.slug+':'+n);
    b.innerHTML=on?'&#9733;':'&#9734;';
    b.classList.toggle('on',on);
    b.addEventListener('click',()=>toggleFav(d,n,b));
  });

  sel.value=i;
  document.getElementById('prevDay').disabled = i>=DAYS.length-1;
  document.getElementById('nextDay').disabled = i<=0;
  if(push!==false) history.replaceState(null,'','#'+d.slug);
  window.scrollTo({top:0,behavior:'smooth'});
}

buildSelect();
sel.addEventListener('change',()=>render(parseInt(sel.value)));
document.getElementById('prevDay').addEventListener('click',()=>render(idx+1));
document.getElementById('nextDay').addEventListener('click',()=>render(idx-1));
document.getElementById('todayBtn').addEventListener('click',()=>render(0));

const start = DAYS.findIndex(d=>d.slug===location.hash.slice(1));
render(start>=0?start:0, false);
window.addEventListener('hashchange',()=>{ const i=DAYS.findIndex(d=>d.slug===location.hash.slice(1)); if(i>=0&&i!==idx)render(i,false); });
</script></body></html>
