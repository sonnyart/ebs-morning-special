<style>
  :root { --accent:#8a6d3b; --bg:#faf6ef; --card:#fff; --ink:#241f17; --kr:#6b6356; --line:#ece3d3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans KR','Apple SD Gothic Neo',-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }

  .picker { display:flex; gap:8px; align-items:center; padding:16px 0 10px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:10; border-bottom:1px solid var(--line); }
  .picker select { flex:1; min-width:150px; padding:9px 12px; border:1px solid var(--accent); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; font-family:inherit; }
  .picker button { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:10px; padding:9px 12px; font-size:14px; cursor:pointer; font-weight:600; }
  .picker button:hover:not(:disabled) { background:var(--accent); color:#fff; }
  .picker button:disabled { opacity:.35; cursor:default; }
  header { border-bottom:2px solid var(--accent); padding:18px 0; }
  .kicker { font-size:12px; letter-spacing:1.5px; color:var(--accent); font-weight:700; text-transform:uppercase; }
  h1 { font-size:27px; margin:8px 0 6px; line-height:1.3; }
  .byline { color:var(--kr); font-size:14px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 22px; }
  .toolbar button { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  .toolbar button:hover, .toolbar button.active { background:var(--accent); color:#fff; }
  .item { display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:12px; }
  .play { flex:0 0 44px; height:44px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; transition:transform .1s; }
  .play:hover { transform:scale(1.08); }
  .play.playing { background:#2e7d5b; }
  .text { flex:1; }
  .num { font-size:11px; font-weight:700; color:var(--accent); margin-right:6px; }
  .en { font-size:17px; font-weight:500; margin-bottom:4px; }
  .kr { color:var(--kr); font-size:15px; }
  .foot { text-align:center; color:var(--kr); font-size:12px; margin-top:30px; }
  .foot a { color:var(--accent); }
  @media (max-width:520px) { h1 { font-size:22px; } .en { font-size:16px; } .wrap { padding:0 14px 70px; } }

</div><script>
const DAYS = [{"slug": "2026-10-14", "date": "2026.10.14. Wed.", "title_en": "Juniper Lattes? Pine Sodas? Food Is Taking Us Back to the Forest.", "author": "Kim Severson", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363771?hmpMnuId=101", "sentences": [{"en": "America's walk into the woods follows an era dominated by international flavors and tropical tastes like dragonfruit, the warm bakery vibe of Generation Z's \"little treats\" culture and the sweet-spicy mashup that birthed a thousand hot honey pizzas.", "kr": "미국이 숲으로 향하는 움직임은 용과 같은 국제적인 풍미와 열대의 맛, Z세대의 '작은 기쁨' 문화에서 비롯된 따뜻한 베이커리 분위기, 그리고 수많은 핫 허니 피자를 탄생시킨 달콤하면서도 매콤한 조합이 지배하던 시대를 뒤따른 것입니다."}, {"en": "\"Now we're starting to see increased interest in flavors that might be about the place, the origin, the landscape or even craftsmanship,\" said Sally Lyons Wyatt, the head of consumer goods and food service at Circana, a global market research and data analytics firm.", "kr": "글로벌 시장조사·데이터분석 기업 서카나(Circana)의 소비재·외식 서비스 부문 책임자인 샐리 라이언스 와이어트는 \"이제 우리는 장소, 원산지, 풍경, 심지어 장인정신에 관한 풍미에 대한 관심이 커지는 것을 보기 시작했습니다\"라고 말했습니다."}, {"en": "\"Consumers increasingly want flavors that evoke nature, foraging and the outdoors.\"", "kr": "\"소비자들은 자연, 채집, 그리고 야외 활동을 떠올리게 하는 풍미를 점점 더 원하고 있습니다.\""}, {"en": "Humans are hard-wired to be physically rewarded by contact with soil and plant life, she said.", "kr": "인간은 흙과 식물을 접촉할 때 신체적으로 보상을 받도록 본능적으로 설계되어 있다고 그녀는 말했습니다."}, {"en": "Flavors from the natural world tap into that, offering an antidote to unsettling digital transformation, climate change and global political conflict.", "kr": "자연 세계에서 온 풍미는 그것을 활용하여, 불안한 디지털 전환과 기후 변화, 그리고 전 세계적인 정치적 갈등에 대한 해독제 역할을 합니다."}, {"en": "A summer of food recalls and, she added, the rise of the Make America Healthy Again movement with its emphasis on natural remedies also fuel the attraction.", "kr": "그녀는 또한 식품 리콜이 잇따랐던 여름과, 자연 요법을 강조하는 '메이크 아메리카 헬시 어게인' 운동의 부상도 이러한 매력을 부추기고 있다고 덧붙였습니다."}, {"en": "Stephanie Mattucci, the principal food and drink strategist for the global food research firm Mintel, sees parallels to the Industrial Revolution and the Gilded Age, when Swiss author Johanna Spyri published \"Heidi.\"", "kr": "글로벌 식품 조사 기업 민텔(Mintel)의 수석 식음료 전략가 스테파니 마투치는 스위스 작가 요한나 슈피리가 《하이디》를 출간했던 산업혁명과 도금시대와의 유사점을 발견합니다."}, {"en": "The story of a young girl who escapes city life to seek solace living in the mountains with her grandfather was a bestseller in the United States, and remains a classic.", "kr": "도시 생활에서 벗어나 할아버지와 함께 산에서 살며 위안을 찾는 어린 소녀의 이야기는 미국에서 베스트셀러였고, 지금도 고전으로 남아 있습니다."}, {"en": "\"In this moment of great change and technological revolution, how can we ground ourselves?\" Mattucci said.", "kr": "\"이 거대한 변화와 기술 혁명의 순간에, 우리는 어떻게 중심을 잡을 수 있을까요?\"라고 마투치는 말했습니다."}, {"en": "\"People are attracted to alpine flavors as a way to step away from overstimulation and into the therapeutic benefit of the forest and the trees and mountains.\"", "kr": "\"사람들은 과도한 자극에서 벗어나 숲과 나무와 산이 주는 치유의 혜택으로 들어가기 위한 방법으로 알프스 풍미에 끌립니다.\""}, {"en": "Andrea Ramirez, Torani's trends and insight manager, said the company took note of the growing popularity of kombucha, matcha and the bitter undertones of an Aperol spritz, as well as Nordic influences like the Danish comfort concept called hygge and an increase in travel to the Dolomites and the Alps.", "kr": "토라니(Torani)의 트렌드·인사이트 매니저인 안드레아 라미레스는 회사가 콤부차와 말차, 그리고 아페롤 스프리츠의 쌉싸름한 뒷맛의 인기 상승뿐 아니라, 덴마크의 편안함 개념인 '휘게(hygge)' 같은 북유럽의 영향과 돌로미티·알프스 여행의 증가에도 주목했다고 말했습니다."}, {"en": "The piney syrup was infused with ginger and sage so it wouldn't remind anyone of a cleaning product, Ramirez said.", "kr": "솔 향 시럽에는 생강과 세이지를 넣어 세정제를 연상시키지 않도록 했다고 라미레스는 말했습니다."}, {"en": "The idea was to offer a trip to the forest in a cup.", "kr": "그 아이디어는 한 잔에 담긴 숲으로의 여행을 선사하는 것이었습니다."}, {"en": "\"If you live in the middle of the city,\" she said, \"you might not have access to clean forests of pine trees.\"", "kr": "\"도시 한복판에 산다면,\" 그녀는 말했습니다. \"깨끗한 소나무 숲을 접할 기회가 없을 수도 있습니다.\""}, {"en": "All the trend-spotter talk of \"mushroom-adjacent flavors\" and \"alpine cues\" is only partly about taking refuge from societal mayhem in the cool forest.", "kr": "트렌드를 읽는 이들이 말하는 '버섯에 가까운 풍미'와 '알프스 신호'라는 이야기는 단지 시원한 숲에서 사회적 혼란을 피해 대피하려는 것만은 아닙니다."}, {"en": "It's also about marketing and the nature of the American consumer.", "kr": "그것은 또한 마케팅과 미국 소비자의 본성에 관한 것이기도 합니다."}, {"en": "\"Part of it, to be sure, is the relentless pursuit of novelty,\" said Helen Zoe Veit, a professor of history at Michigan State University who has written two books about the nation's food.", "kr": "\"물론 그중 일부는 새로움을 향한 끊임없는 추구입니다\"라고, 미국 음식에 관한 책 두 권을 쓴 미시간주립대 역사학 교수 헬렌 조 비트는 말했습니다."}, {"en": "\"And then there is just copying other people for no other reason than everyone else is drinking green matcha or a pine-flavored soda, so I might as well have one, too.\"", "kr": "\"그리고 다른 사람들이 모두 그린 말차나 솔 향 소다를 마시고 있다는 이유 말고는 다른 이유 없이 그저 남을 따라 하는 것도 있습니다. 그래서 나도 한 잔 마셔 보는 게 낫겠다 싶은 거죠.\""}]}, {"slug": "2026-10-13", "date": "2026.10.13. Tue.", "title_en": "Forget Quiet Luxury. In Ancient Rome, the Fashion Was Loud.", "author": "Nicolas Liney", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363383?hmpMnuId=101", "sentences": [{"en": "As Rome consolidated its control over the Mediterranean and beyond in the early centuries of the first millennium, a thriving trade network fueled an increasingly consumerist society.", "kr": "로마가 첫 천년기 초반 몇 세기 동안 지중해와 그 너머에 대한 지배권을 공고히 해 나가면서, 번성하던 무역 네트워크는 점점 더 소비 지향적인 사회를 부추겼습니다."}, {"en": "Fashion trends and materials, like silk, pearls and dyes, flowed in from encounters with other cultures and helped demarcate social hierarchies in Rome.", "kr": "실크, 진주, 염료 같은 패션 트렌드와 재료들은 다른 문화와의 교류를 통해 유입되어, 로마의 사회적 위계를 구분 짓는 데 기여했습니다."}, {"en": "The more exotic or rarefied your outfit was, the more clout you carried.", "kr": "복장이 더 이국적이거나 귀할수록, 그만큼 더 큰 영향력을 지녔습니다."}, {"en": "Textiles decay easily, and hard evidence for Roman fashion is vanishingly rare.", "kr": "직물은 쉽게 썩기 때문에, 로마 패션에 대한 확실한 증거는 극히 드뭅니다."}, {"en": "But Roman portrait sculpture can tell us a lot about clothing, hairstyles and jewelry — even what perfumes people used.", "kr": "하지만 로마의 초상 조각은 의복, 헤어스타일, 장신구에 대해 많은 것을 알려 줍니다 — 심지어 어떤 향수를 썼는지까지도요."}, {"en": "And because these statues broadcast idealized versions of their subjects, they reveal even more about how people wanted to be seen.", "kr": "그리고 이 조각상들은 대상 인물의 이상화된 모습을 널리 보여 주는 것이기에, 사람들이 어떻게 보이고 싶어 했는지를 한층 더 잘 드러냅니다."}, {"en": "Perhaps predictably, many sculptures in the exhibition feature a subject wearing a toga or a stola, a sort of pinafore for women.", "kr": "어쩌면 예상대로, 전시의 많은 조각상들은 토가나 여성용 원피스형 앞치마라 할 수 있는 스톨라를 입은 인물을 묘사하고 있습니다."}, {"en": "These garments, which telegraphed Roman citizenship, remained remarkably unchanged over the centuries.", "kr": "로마 시민권을 드러내는 이 의복들은 수 세기 동안 놀라울 정도로 변함없이 유지되었습니다."}, {"en": "But ornaments, hairstyles and dyes offered a way of standing out.", "kr": "그러나 장신구, 헤어스타일, 염료는 남들과 구별되는 수단을 제공했습니다."}, {"en": "Many of the statues were originally painted in vibrant pigments, although barely any trace is left today.", "kr": "많은 조각상들은 원래 선명한 색소로 채색되어 있었지만, 오늘날에는 그 흔적이 거의 남아 있지 않습니다."}, {"en": "The Glyptotek, a major center for research on the use of color in ancient sculpture, has used paint residue analysis to produce digital reconstructions displayed on screens in the show.", "kr": "고대 조각의 색채 사용 연구에서 주요 중심지인 글립토테크 미술관은 페인트 잔여물 분석을 활용해, 전시장 화면에 표시되는 디지털 복원 영상을 제작했습니다."}, {"en": "Dyes for garments were sourced from around the empire.", "kr": "의복용 염료는 제국 전역에서 조달되었습니다."}, {"en": "Purple — the most prestigious — was traditionally restricted to the garments of the elite.", "kr": "가장 권위 있는 색인 보라색은 전통적으로 엘리트 계층의 의복에만 쓰이도록 제한되었습니다."}, {"en": "The best purples came from the glands of Murex sea snails from the eastern Mediterranean, an exploitative practice that nearly drove the species to extinction.", "kr": "최고급 보라색은 동부 지중해산 무렉스 바다 달팽이의 분비샘에서 얻었는데, 이는 그 종을 거의 멸종으로 몰아간 착취적 관행이었습니다."}, {"en": "\"The word sustainability wouldn't make any sense to Romans,\" Broens said.", "kr": "\"지속가능성이라는 단어는 로마인들에게 아무 의미도 없었을 겁니다\"라고 브로엔스는 말했습니다."}, {"en": "Other dyes from imperial provinces were equally valuable and signified wealth, like kermes, a vermilion derived from insects, or saffron.", "kr": "제국의 속주들에서 온 다른 염료들도 마찬가지로 귀했고 부를 상징했는데, 곤충에서 추출한 주홍색 염료인 케르메스나 사프란이 그 예입니다."}, {"en": "These dyes were used for the clothes of wealthy citizens outside the Roman elite, including freed slaves, who were not allowed to wear purple.", "kr": "이 염료들은 보라색을 입는 것이 허용되지 않았던 해방 노예를 포함해, 로마 엘리트 계층 밖의 부유한 시민들의 옷에 사용되었습니다."}, {"en": "Other fashion trends, like hairstyles, could reflect Roman conquests.", "kr": "헤어스타일 같은 다른 패션 트렌드는 로마의 정복을 반영하기도 했습니다."}, {"en": "When Rome was struggling to subdue Germanic territories in the first century, elite women often wore wigs made from the blond hair of Germanic captives or tried to imitate the color with dye.", "kr": "로마가 1세기에 게르만 지역을 복속시키는 데 어려움을 겪고 있을 때, 엘리트 여성들은 게르만 포로의 금발 머리카락으로 만든 가발을 쓰거나, 염료로 그 색을 흉내 내려 했습니다."}, {"en": "In this case, Broens said, \"Women's beauty was quite literally constructed from subjugated peoples.\"", "kr": "이에 대해 브로엔스는 \"여성의 아름다움은 말 그대로 정복된 민족들로부터 만들어졌다\"고 말했습니다."}, {"en": "Yet not all foreign influences were harvested by force.", "kr": "하지만 모든 외래의 영향이 무력으로 거둬들여진 것은 아니었습니다."}, {"en": "As Rome's elite diversified, hairstyles were borrowed for cosmopolitan cachet.", "kr": "로마의 엘리트가 다양해지면서, 헤어스타일은 국제적인 위신을 얻기 위해 차용되었습니다."}, {"en": "Julia Domna, the wife of the emperor Septimius Severus, came from a powerful Syrian family, and her distinctive coiffure appears to have been a popular style in that region.", "kr": "셉티미우스 세베루스 황제의 아내인 율리아 돔나는 강력한 시리아 가문 출신이었고, 그녀의 독특한 머리 모양은 그 지역에서 유행하던 스타일이었던 것으로 보입니다."}, {"en": "A portrait bust in the exhibition displays the look, which was widely copied.", "kr": "전시에 나온 한 초상 흉상이 그 모습을 보여 주는데, 이 스타일은 널리 모방되었습니다."}, {"en": "We also know that perfume styles tracked the empire's expansion, with popular varieties including \"Egyptian\" and \"Assyrian.\"", "kr": "우리는 또한 향수 스타일이 제국의 확장을 따라갔다는 것을 아는데, 인기 있는 종류로는 \"이집트산\"과 \"아시리아산\"이 있었습니다."}, {"en": "Recent research shows that statues of the elite would even be regularly anointed with scents.", "kr": "최근 연구에 따르면, 엘리트의 조각상들에는 정기적으로 향을 발라 주기까지 했습니다."}, {"en": "Some recipes for scents survive, but we'll never know what they really smelled like.", "kr": "향에 대한 제조법 일부는 남아 있지만, 그것들이 실제로 어떤 향이었는지는 결코 알 수 없을 것입니다."}, {"en": "Instead, the Glyptotek invited Danish cosmetics brand Karmameju to create its own interpretations — bringing a touch of Scandinavian elegance to the imperial glitz.", "kr": "대신 글립토테크 미술관은 덴마크 화장품 브랜드 카르마메주를 초청해 나름의 해석을 만들게 했습니다 — 제국의 화려함에 스칸디나비아의 우아함을 한 스푼 더한 것이죠."}]}];
let idx = 0, rate = 1, current = null, currentBtn = null, sequential = false;
const view = document.getElementById('dayView');
const sel = document.getElementById('daySelect');

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function buildSelect(){
  DAYS.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=(i===0? d.date+'  (최신)' : d.date);
    sel.appendChild(o);
  });
}

function stop(){
  document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0;});
  if(currentBtn)currentBtn.classList.remove('playing');
  if(current)current.removeEventListener('ended',onEnded);
  current=null;currentBtn=null;sequential=false;
}
function playOne(i,btn){
  stop();
  const a=document.getElementById('a'+i);
  if(!a)return;
  current=a;currentBtn=btn;a.playbackRate=rate;btn.classList.add('playing');
  a.addEventListener('ended',onEnded);a.play().catch(()=>{});
}
function onEnded(){
  if(currentBtn)currentBtn.classList.remove('playing');
  const fin=current?current.id.slice(1):null;current=null;currentBtn=null;
  if(sequential&&fin){const n=parseInt(fin)+1;const b=document.querySelector('.play[data-i="'+n+'"]');if(b)playOne(n,b);else sequential=false;}
}

function render(i, push){
  i=Math.max(0,Math.min(DAYS.length-1,i));
  stop();
  idx=i;
  const d=DAYS[i];
  const rows=d.sentences.map((s,n)=>'<div class="item">'
    +'<button class="play" data-i="'+(n+1)+'" aria-label="Play">&#9654;</button>'
    +'<div class="text"><div class="en"><span class="num">'+(n+1)+'.</span>'+esc(s.en)+'</div>'
    +'<div class="kr">'+esc(s.kr)+'</div></div>'
    +'<audio id="a'+(n+1)+'" preload="none" src="audio/'+d.slug+'/s'+String(n+1).padStart(2,'0')+'.m4a"></audio>'
    +'</div>').join('');
  view.innerHTML='<header>'
    +'<div class="kicker">EBS 모닝스페셜 · News Coverage from The New York Times</div>'
    +'<h1>'+esc(d.title_en)+'</h1>'
    +'<div class="byline">'+esc(d.author)+' · '+esc(d.copyright)+' · '+esc(d.date)+'</div>'
    +'</header>'
    +'<div class="toolbar">'
    +'<button id="playAll">&#9654; 모두 재생</button>'
    +'<button id="stopAll">&#9632; 정지</button>'
    +'<button class="speed" data-r="0.75">0.75x</button>'
    +'<button class="speed" data-r="1">1x</button>'
    +'<button class="speed" data-r="1.25">1.25x</button>'
    +'</div>'
    +rows
    +'<div class="foot">출처: EBS 최수진의 모닝스페셜 방송 내용 게시판 · <a href="'+esc(d.source_url)+'" target="_blank" rel="noopener">원문 보기</a><br>'
    +'본 텍스트는 학습용으로 정리한 것으로 원문과 다를 수 있습니다.</div>';

  view.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>playOne(parseInt(b.dataset.i),b)));
  view.querySelector('#stopAll').addEventListener('click',stop);
  view.querySelector('#playAll').addEventListener('click',()=>{stop();sequential=true;playOne(1,view.querySelector('.play[data-i="1"]'));});
  view.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>{
    rate=parseFloat(b.dataset.r);
    view.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(current)current.playbackRate=rate;
  }));
  const act=view.querySelector('.speed[data-r="'+rate+'"]'); if(act)act.classList.add('active');

  sel.value=i;
  document.getElementById('prevDay').disabled = i>=DAYS.length-1;
  document.getElementById('nextDay').disabled = i<=0;
  if(push!==false) history.replaceState(null,'','#'+d.slug);
  window.scrollTo({top:0,behavior:'smooth'});
}

buildSelect();
sel.addEventListener('change',()=>render(parseInt(sel.value)));
document.getElementById('prevDay').addEventListener('click',()=>render(idx+1));
document.getElementById('nextDay').addEventListener('click',()=>render(idx-1));
document.getElementById('todayBtn').addEventListener('click',()=>render(0));

const start = DAYS.findIndex(d=>d.slug===location.hash.slice(1));
render(start>=0?start:0, false);
window.addEventListener('hashchange',()=>{ const i=DAYS.findIndex(d=>d.slug===location.hash.slice(1)); if(i>=0&&i!==idx)render(i,false); });
</script></body></html>
