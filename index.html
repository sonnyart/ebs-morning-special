<style>
  :root { --accent:#8a6d3b; --bg:#faf6ef; --card:#fff; --ink:#241f17; --kr:#6b6356; --line:#ece3d3; }

  .picker select { flex:1; min-width:150px; padding:9px 12px; border:1px solid var(--accent); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; font-family:inherit; }
  .picker button { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:10px; padding:9px 12px; font-size:14px; cursor:pointer; font-weight:600; }

  header { border-bottom:2px solid var(--accent); padding:18px 0; }

  h1 { font-size:27px; margin:8px 0 6px; line-height:1.3; }

  .fav { flex:0 0 42px; height:42px; border:none; background:transparent; color:#c9a86a; font-size:24px; cursor:pointer; line-height:1; padding:0; }

  .favlink { margin-left:auto; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:9px 15px; font-size:14px; font-weight:600; text-decoration:none; }
  .favlink:hover { background:var(--accent); color:#fff; }
  .item { display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:12px; }

  .num { font-size:11px; font-weight:700; color:var(--accent); margin-right:6px; }

  @media (max-width:520px) { h1 { font-size:22px; } .en { font-size:16px; } .wrap { padding:0 14px 70px; } }
</style></head><body><div class="wrap">

</div><script>
const DAYS = [{"slug": "2026-10-28", "date": "2026.10.28. Wed.", "title_en": "How Do I Know if the Outfit I Want to Buy Is Well-Made?", "author": "Vanessa Friedman", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000365748?hmpMnuId=101", "sentences": [{"en": "For decades there was an implicit assumption among most shoppers — an unstated bargain, if you will — that luxury brands were markers of quality, that part of what you were paying for was, in fact, exactly that.", "kr": "수십 년 동안 대부분의 소비자들 사이에는 암묵적인 전제가 있었습니다. 말하자면 굳이 말로 하지 않아도 통하는 약속이었죠. 명품 브랜드는 곧 품질의 표식이며, 여러분이 지불하는 값의 일부가 사실상 바로 그것이라는 생각이었습니다."}, {"en": "That was the point of the \"made in\" label (Made in Italy, Made in France), signifying that this was an item created by highly trained and specialist craftspeople who came from a long heritage of making and that they were using the best materials.", "kr": "'메이드 인' 라벨(Made in Italy, Made in France)의 요점이 바로 그것이었습니다. 이 제품은 오랜 장인 전통을 이어온, 고도로 훈련된 전문 장인들이 최고의 소재를 사용해 만든 것임을 나타내는 표시였죠."}, {"en": "But as \"luxury\" has become a fungible word — these days it can seem that everything is luxury, from coffee to socks — and supply chains have become ever murkier, with factories in Italy making high fashion products in sweatshop conditions and many material \"certifications\" proving unreliable, those old signposts are less and less meaningful.", "kr": "하지만 '럭셔리'라는 말이 이제 어디에나 쓸 수 있는 대체 가능한 단어가 되어 버렸고 — 요즘은 커피부터 양말까지 무엇이든 럭셔리인 것처럼 보일 수 있죠 — 공급망은 점점 더 불투명해졌습니다. 이탈리아의 공장들이 열악한 노동 환경에서 고급 패션 제품을 만들고 많은 원단 '인증'이 신뢰할 수 없는 것으로 드러나면서, 그 오래된 표지판들은 점점 의미를 잃어가고 있습니다."}, {"en": "So, how is someone looking for an investment piece to know if what they are buying is going to last?", "kr": "그렇다면 오래 두고 입을 만한 '투자 가치 있는' 옷을 찾는 사람은 자신이 사는 물건이 과연 오래갈지 어떻게 알 수 있을까요?"}, {"en": "According to Christy Rilling, a tailor who used to work with Michelle Obama and has since introduced her own collection, called Guild of Hands, you should start with the material.", "kr": "미셸 오바마와 일했던 적이 있고 이후 '길드 오브 핸즈(Guild of Hands)'라는 자신의 컬렉션을 선보인 재단사 크리스티 릴링(Christy Rilling)에 따르면, 소재부터 확인해야 합니다."}, {"en": "\"Historically, long-lasting clothing was made of pure silk, wool and cotton,\" she pointed out.", "kr": "'역사적으로 오래가는 옷은 순수 실크와 울, 면으로 만들어졌어요'라고 그녀는 지적했습니다."}, {"en": "That means that if you are buying suiting, she said, \"check the lining content.\"", "kr": "즉, 정장을 살 때는 '안감의 소재를 확인하라'고 그녀는 말했습니다."}, {"en": "She added, \"Luxury fabrics should read 100% silk rather than polyester, nylon or the more recently used polyamide, which is another term for nylon.\"", "kr": "'럭셔리 원단은 폴리에스터나 나일론, 또는 최근에 쓰이는 폴리아미드(나일론의 다른 이름)가 아니라 100% 실크로 표기되어 있어야 합니다'라고 그녀는 덧붙였습니다."}, {"en": "For pants, consider the fabric breakdown.", "kr": "바지의 경우에는 원단 구성 내역(혼용률)을 살펴보세요."}, {"en": "\"More than 2% Lycra or elastane mixed with a natural fiber will inevitably bag out over time,\" Rilling said, making your once-tailored trousers look droopy.", "kr": "'천연 섬유에 라이크라나 엘라스테인(스판덱스)이 2% 이상 섞이면 시간이 지나면서 어쩔 수 없이 늘어나 처집니다'라고 릴링은 말했습니다. 한때 잘 맞던 바지가 축 처져 보이게 되는 것이죠."}, {"en": "Other tells include seams, which should be straight, not puckered, and, if you tug on them, should not pull apart.", "kr": "다른 단서로는 솔기가 있는데, 솔기는 주름지지 않고 곧아야 하며, 잡아당겨도 벌어지지 않아야 합니다."}, {"en": "Likewise, if there are patterns involved, they should match up at the seam line, not resemble a puzzle jumbled together.", "kr": "마찬가지로 무늬가 있다면 솔기선에서 무늬가 정확히 맞아야 하고, 뒤죽박죽 섞여 맞춰진 퍼즐 같아서는 안 됩니다."}, {"en": "If you are buying a jacket, real buttonholes on the cuffs, as opposed to trompe l'oeil buttonholes, are a sign of the attention to detail that reflects quality.", "kr": "재킷을 산다면, 소맷단에 있는 진짜 단추 구멍은 (눈속임용 가짜 단추 구멍과 달리) 품질을 반영하는 세심함의 표시입니다."}, {"en": "And speaking of buttons, make sure they are tightly attached, not flopping off.", "kr": "그리고 단추 얘기가 나온 김에, 단추가 헐렁하게 달려 흔들리지 않고 단단히 고정되어 있는지 확인하세요."}, {"en": "Finally, there is one modern development that may be of use.", "kr": "마지막으로, 도움이 될 만한 현대적인 변화가 하나 있습니다."}, {"en": "Thanks to new sustainability legislation in the European Union, fashion brands have to be more transparent about their supply chain, at least online.", "kr": "유럽연합의 새로운 지속가능성 법안 덕분에, 패션 브랜드들은 적어도 온라인에서는 공급망에 대해 더 투명하게 공개해야 합니다."}, {"en": "(Similar legislation is pending in New York.)", "kr": "(비슷한 법안이 뉴욕에서도 추진 중입니다.)"}, {"en": "The more a manufacturer knows about how something is made — and it is shocking how little some of them actually know — the better the odds are that the quality has been checked along the way.", "kr": "제조사가 어떤 제품이 어떻게 만들어지는지에 대해 많이 알수록 — 일부 업체가 실제로는 얼마나 모르는지 충격적일 정도인데요 — 그 과정에서 품질이 검증됐을 확률이 더 높아집니다."}, {"en": "If all else fails, the most reliable answer is perhaps the oldest: conversation and relationships.", "kr": "모든 방법이 통하지 않는다면, 가장 믿을 만한 답은 아마도 가장 오래된 방법일 것입니다. 바로 대화와 관계입니다."}, {"en": "Know your manufacturer.", "kr": "제조사를 알아 두세요."}, {"en": "Shop small and local.", "kr": "작고 지역 기반인 곳에서 구매하세요."}, {"en": "Flash can always be added to a wardrobe through less expensive trend pieces, but the strongest foundations, when it comes to clothes as when it comes to pretty much anything, are built on trust — and taking your time.", "kr": "화려함은 언제든 저렴한 트렌드 아이템으로 옷장에 더할 수 있지만, 가장 튼튼한 기반은 옷이든 거의 모든 것이든 신뢰 위에 세워집니다. 그리고 천천히 시간을 들이는 것 위에 말이죠."}]}, {"slug": "2026-10-27", "date": "2026.10.27. Tue.", "title_en": "It's Sliced Cheese on Bread. And It's Rocking Copenhagen's World.", "author": "Amelia Nierenberg", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000365484?hmpMnuId=101", "sentences": [{"en": "Copenhagen is famed for its innovative gastronomy and elaborate dishes.", "kr": "코펜하겐은 혁신적인 미식과 정교한 요리로 유명합니다."}, {"en": "But these days its hottest food is its most basic: just bread, butter and hard cheese.", "kr": "하지만 요즘 이 도시에서 가장 인기 있는 음식은 가장 기본적인 것, 바로 빵과 버터와 딱딱한 치즈뿐입니다."}, {"en": "And Copenhagen's top bakeries are in a dead heat to make the best one around.", "kr": "그리고 코펜하겐의 최고 베이커리들은 가장 훌륭한 그것을 만들기 위해 치열한 접전을 벌이고 있습니다."}, {"en": "It's called a bolle med ost (bun with cheese), shortened by many to BMO, an abbreviation that was entered into the biggest Danish dictionary this year.", "kr": "그것은 '볼레 메드 오스트(bolle med ost, 치즈를 얹은 빵)'라고 불리는데, 많은 이가 줄여서 BMO라고 부르며, 이 약어는 올해 덴마크 최대 사전에 등재되었습니다."}, {"en": "The BMO has become a calling card for Copenhagen's best bakers.", "kr": "BMO는 코펜하겐 최고의 제빵사들을 대표하는 상징이 되었습니다."}, {"en": "Batch after batch, they experiment with the bread, the cheese and, yes, even the butter as they strive to stand out in a city obsessed with understated excellence.", "kr": "절제된 완성도에 집착하는 이 도시에서 돋보이기 위해, 그들은 한 차례 한 차례 빵과 치즈, 그리고 물론 버터까지도 실험을 거듭합니다."}, {"en": "The BMO is hard to mess up, but almost impossible to perfect.", "kr": "BMO는 망치기는 어렵지만 완벽하게 만들기는 거의 불가능합니다."}, {"en": "\"You can't pretend with BMOs,\" said Anne-Sophie Lahme, a Danish trend researcher who focuses on food.", "kr": "\"BMO로는 허세를 부릴 수 없어요\"라고 음식 분야를 전문으로 하는 덴마크 트렌드 연구원 안네소피 라메(Anne-Sophie Lahme)는 말했습니다."}, {"en": "\"You can't fake it.", "kr": "\"속임수를 쓸 수 없어요."}, {"en": "It has to be really, really good.\"", "kr": "정말, 정말 맛있어야 하죠.\""}, {"en": "The nouveau-BMOs first appeared a few years ago, in a post-peak-pandemic onslaught of bread-baking.", "kr": "새로운 스타일의 BMO는 몇 년 전, 팬데믹 정점 이후 불어닥친 빵 굽기 열풍 속에서 처음 등장했습니다."}, {"en": "Sourdough starters passed between friends and new bakeries opened, street by street.", "kr": "사워도우 스타터(천연발효종)가 친구들 사이에서 나눠졌고, 거리마다 새로운 베이커리가 문을 열었습니다."}, {"en": "At some point, the abbreviation was born, and quickly proved divisive.", "kr": "어느 순간 그 약어가 탄생했고, 곧 의견을 가르는 논란거리임이 드러났습니다."}, {"en": "To skeptics, the nickname sounds a lot like gentrification — dressing up a beloved family food in frippery.", "kr": "회의적인 사람들에게 그 별명은 고급화(젠트리피케이션)처럼 들렸습니다. 사랑받는 가정식 음식을 번지르르한 장식으로 치장한 것이라는 뜻이죠."}, {"en": "\"It is literally just a bun with butter and a slice of cheese,\" said Nina Bauer, a Danish food historian.", "kr": "\"그것은 말 그대로 버터와 치즈 한 조각을 얹은 빵일 뿐입니다\"라고 덴마크 음식사학자 니나 바우어(Nina Bauer)는 말했습니다."}, {"en": "Claus Meyer, a titan of Denmark's food scene who co-owns Meyers Bageri, said, \"I could not see myself entering a bakery and asking for a 'BMO.'\"", "kr": "덴마크 음식계의 거물이자 마이어스 베이게리(Meyers Bageri)의 공동 소유주인 클라우스 마이어(Claus Meyer)는 \"베이커리에 들어가 'BMO'를 달라고 말하는 제 모습은 상상할 수 없습니다\"라고 말했습니다."}, {"en": "Thomas Spelling, owner of the microbakery Rondo, almost shuddered at the idea.", "kr": "소규모 베이커리 론도(Rondo)의 주인 토마스 스펠링(Thomas Spelling)은 그 생각에 거의 몸서리를 쳤습니다."}, {"en": "\"I would never say that myself,\" he said.", "kr": "\"저는 절대 그렇게 말하지 않을 겁니다\"라고 그는 말했습니다."}, {"en": "The cheese Gammel Knas almost tells the story of the trend on its own.", "kr": "'감멜 크나스(Gammel Knas)'라는 치즈는 그 자체만으로 이 유행의 이야기를 거의 말해 줍니다."}, {"en": "By 2024, BMOs had become so popular that Gammel Knas supplies began to run low.", "kr": "2024년 무렵 BMO가 너무 인기를 끌면서 감멜 크나스의 공급이 부족해지기 시작했습니다."}, {"en": "Danish newspapers reported a \"cheese crisis.\"", "kr": "덴마크 신문들은 '치즈 위기'를 보도했습니다."}, {"en": "Customers raced to stores.", "kr": "고객들은 서둘러 매장으로 달려갔습니다."}, {"en": "Gammel Knas needs to mature for more than 24 months to develop its signature crunchy protein crystals.", "kr": "감멜 크나스는 특유의 바삭한 단백질 결정을 만들기 위해 24개월 넘게 숙성되어야 합니다."}, {"en": "But new bakeries kept opening and demanding more cheese.", "kr": "하지만 새로운 베이커리들은 계속 문을 열며 더 많은 치즈를 요구했습니다."}, {"en": "For months, Sofie Biltoft-Riis, the director of Arla Unika, the company that produces that cheese, was in meetings about how to deal with the BMO skyrocket.", "kr": "몇 달 동안, 그 치즈를 생산하는 회사인 아를라 우니카(Arla Unika)의 책임자 소피 빌토프트리스(Sofie Biltoft-Riis)는 급등한 BMO 수요에 어떻게 대처할지 회의를 계속했습니다."}, {"en": "Copenhagen may be reaching a BMO plateau.", "kr": "코펜하겐은 BMO 정체기에 접어들고 있는지도 모릅니다."}, {"en": "But the snack is still the bestseller at any bakery of repute.", "kr": "하지만 그 간식은 여전히 이름난 베이커리라면 어디서든 베스트셀러입니다."}, {"en": "No longer as hyped, they're just part of the fabric of the city.", "kr": "더 이상 그렇게 과대 선전되지는 않지만, 이제 그것들은 이 도시를 이루는 요소의 일부가 되었습니다."}, {"en": "And locals have perfected eating them.", "kr": "그리고 현지인들은 그것을 먹는 법을 완벽하게 익혔습니다."}, {"en": "Even though a bolle med ost can be snarfed one-handed, it's not.", "kr": "볼레 메드 오스트는 한 손으로 게걸스럽게 먹을 수 있지만, 그렇게 먹지 않습니다."}, {"en": "At least not by any self-respecting Copenhagener.", "kr": "적어도 자존심 있는 코펜하겐 사람이라면 말이죠."}, {"en": "I found this out the hard way.", "kr": "저는 이 사실을 고생을 하면서 알게 되었습니다."}, {"en": "I'm from New York City.", "kr": "저는 뉴욕 출신입니다."}, {"en": "I can knock back a slice of pizza in a minute flat.", "kr": "저는 피자 한 조각을 단 1분 만에 벌컥벌컥 먹어치울 수 있습니다."}, {"en": "So with the first few BMOs I tried, I combined them into a sandwich, and ate quickly and efficiently with both hands.", "kr": "그래서 처음 먹어 본 몇 개의 BMO는 겹쳐서 샌드위치로 만들어, 양손으로 빠르고 효율적으로 먹었습니다."}, {"en": "Two friends set me straight.", "kr": "두 친구가 제 생각을 바로잡아 주었습니다."}, {"en": "\"It's just, like, very, very important that you eat it like this,\" said Emma Toft Kromann, holding it open-faced.", "kr": "\"이렇게 먹는 게 정말, 정말 중요해요\"라고 에마 토프트 크로만(Emma Toft Kromann)은 빵을 오픈 샌드위치처럼(위를 덮지 않은 채) 들고 말했습니다."}, {"en": "\"If you see someone eating it like a burger, you know they're not from here,\" added Ophelia Ernland.", "kr": "\"누군가가 그것을 버거처럼 먹는 걸 본다면, 그 사람이 이곳 출신이 아니라는 걸 알 수 있어요\"라고 오펠리아 에른란드(Ophelia Ernland)는 덧붙였습니다."}]}, {"slug": "2026-10-26", "date": "2026.10.26. Mon.", "title_en": "Chimps Steal Less Often From Their Friends, Even When Offered Pineapple", "author": "Taylor Mitchell Brown", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000365276?hmpMnuId=101", "sentences": [{"en": "Pasa and Yoyo, two female chimpanzees, are best friends.", "kr": "암컷 침팬지 두 마리인 파사(Pasa)와 요요(Yoyo)는 절친입니다."}, {"en": "They spend their afternoons lounging together in the warm grass of the Ngamba Island Chimpanzee Sanctuary in Uganda, grooming and sharing food.", "kr": "이들은 우간다의 응암바 섬 침팬지 보호구역의 따뜻한 잔디밭에서 오후 시간을 함께 느긋하게 보내며 털을 골라 주고 먹이를 나눠 먹습니다."}, {"en": "Sometimes they even try to escape the grounds together.", "kr": "때로는 함께 구역을 탈출하려 시도하기도 합니다."}, {"en": "They are also less likely to steal food from each other, according to the results of a new experiment that pitted friendship against pineapple slices.", "kr": "우정과 파인애플 조각을 맞붙인 새로운 실험 결과에 따르면, 이들은 서로의 먹이를 훔칠 가능성도 더 낮았습니다."}, {"en": "The new study is the first to find that primates can prioritize friendships over tasty treats, revealing an ability to squash selfish impulses previously undocumented in our hairy ape cousins.", "kr": "이번 연구는 영장류가 맛있는 간식보다 우정을 우선시할 수 있다는 사실을 처음으로 밝혀냈으며, 털복숭이 유인원 사촌들에게서 지금까지 기록된 적 없던 이기적 충동을 억누르는 능력을 드러냈습니다."}, {"en": "The discovery, which may hint at the roots of human norms around friendship, was published in the journal Evolution and Human Behavior.", "kr": "인간의 우정에 관한 규범의 뿌리를 암시할 수 있는 이 발견은 학술지 '에볼루션 앤드 휴먼 비헤이비어(Evolution and Human Behavior)'에 게재되었습니다."}, {"en": "\"It wasn't obvious to us that chimpanzees would steal less from their friends,\" said Oded Ritov, a social psychologist at the University of California, Berkeley and lead author of the study.", "kr": "\"침팬지가 친구에게서는 덜 훔칠 것이라는 점은 우리에게 분명하지 않았습니다\"라고 캘리포니아 대학교 버클리 캠퍼스의 사회심리학자이자 이번 연구의 제1저자인 오데드 리토프(Oded Ritov)는 말했습니다."}, {"en": "The discovery shows that chimps, like humans, have social expectations of each other, he added.", "kr": "이 발견은 침팬지도 인간처럼 서로에 대해 사회적 기대를 지니고 있음을 보여 준다고 그는 덧붙였습니다."}, {"en": "\"We think that these expectations might be a basic building block that later evolved into fairness and other types of morality we see in humans.\"", "kr": "\"우리는 이러한 기대가 나중에 진화하여 인간에게서 볼 수 있는 공정성과 그 밖의 여러 도덕성으로 발전한 기본 구성 요소일 수 있다고 생각합니다.\""}, {"en": "The team scrutinized 800 hours of video recordings of the Uganda sanctuary to figure out which chimps were friends.", "kr": "연구팀은 어떤 침팬지들이 친구 사이인지 알아내기 위해 우간다 보호구역의 영상 기록 800시간 분량을 면밀히 살펴보았습니다."}, {"en": "Then they set up trials in which the chimps were placed in pairs.", "kr": "그런 다음 침팬지들을 둘씩 짝지어 놓는 실험을 설계했습니다."}, {"en": "One of the chimps in a pair had the option of being a thief who could steal fruit from a victim; the victim was either a friend or a neutral acquaintance.", "kr": "한 쌍 중 한 침팬지는 희생자로부터 과일을 훔칠 수 있는 도둑이 될 수 있었고, 희생자는 친구이거나 특별히 친하지 않은 아는 사이였습니다."}, {"en": "The chimps sat in adjacent rooms, one with metal trays stocked with pineapple slices and the other with ropes attached to the trays, which the thief could pull to steal the treats for itself.", "kr": "침팬지들은 서로 인접한 방에 앉았는데, 한 방에는 파인애플 조각이 담긴 금속 쟁반이 있었고 다른 방에는 쟁반에 연결된 밧줄이 있어서, 도둑이 이를 잡아당겨 간식을 자기 것으로 훔칠 수 있었습니다."}, {"en": "\"Sometimes the thieves would come in and they'd rip that tray,\" said Lewis.", "kr": "\"때로는 도둑 침팬지들이 들어와서 쟁반을 낚아채기도 했습니다\"라고 루이스(Lewis)는 말했습니다."}, {"en": "But other times they came in, inspected the rope, then dropped it in an act of protest.", "kr": "하지만 다른 때에는 들어와서 밧줄을 살펴보다가 항의하듯 밧줄을 떨어뜨리기도 했습니다."}, {"en": "When Yoyo was faced with the opportunity to steal from Pasa, she rejected the experiment altogether, turning her back to the ropes and refusing to enter the room at all.", "kr": "요요는 파사에게서 훔칠 기회를 마주하자 실험 자체를 거부하며 밧줄에 등을 돌리고는 방에 아예 들어가기를 거부했습니다."}, {"en": "When a chimp did steal from a friend, the result was chaos.", "kr": "침팬지가 실제로 친구에게서 훔치면 그 결과는 아수라장이었습니다."}, {"en": "The betrayal induced the victimized chimp to do things like pound its fists into the ground, screech loudly or scratch itself in a fit of anxiety, showing that it had expected more from its pal.", "kr": "배신당한 침팬지는 주먹으로 땅을 두드리거나 크게 비명을 지르거나 불안에 못 이겨 자신을 긁는 등의 행동을 보였는데, 이는 친구에게 더 많은 것을 기대했었다는 뜻이었습니다."}, {"en": "But after these betrayals, researchers found that the same chimps were quicker to forgive their friends, eventually acquiescing to such swindling in later trials.", "kr": "하지만 연구자들은 이러한 배신이 있은 뒤에도 같은 침팬지들이 친구를 더 빨리 용서했고, 이후의 실험에서는 결국 그러한 빼앗김을 묵인했다는 사실을 발견했습니다."}, {"en": "Nonfriends received no such grace, and were met with the same degree of anger throughout the experiment.", "kr": "친구가 아닌 상대에게는 그런 관대함이 없었고, 실험 내내 같은 정도의 분노로 맞섰습니다."}, {"en": "\"The fact that they're able to attenuate this behavior depending on their social relationships is incredibly important,\" said Lewis, \"and we think it's critical for the maintenance of these social relationships over time.\"", "kr": "\"이들이 사회적 관계에 따라 이런 행동을 약화시킬 수 있다는 사실은 정말 중요합니다. 그리고 우리는 그것이 시간이 지나면서 이러한 사회적 관계를 유지하는 데 결정적이라고 생각합니다\"라고 루이스는 말했습니다."}, {"en": "As humans, \"we put a lot of weight not just on the nice things people do for us, but also the lack of mean things they do,\" said Goldsborough.", "kr": "인간으로서 \"우리는 사람들이 우리에게 해 주는 좋은 일뿐 아니라 그들이 하지 않는 못된 일에도 큰 비중을 둡니다\"라고 골즈버러(Goldsborough)는 말했습니다."}, {"en": "\"This study shows very nicely that chimpanzees also do this.\"", "kr": "\"이 연구는 침팬지 역시 그렇게 한다는 것을 아주 잘 보여 줍니다.\""}]}, {"slug": "2026-10-23", "date": "2026.10.23. Fri.", "title_en": "Was the Human Gut Healthier in Ancient Times?", "author": "Carl Zimmer", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000365076?hmpMnuId=101", "sentences": [{"en": "The human microbiome — the trillions of microbes that live in our guts — was a stable ecosystem for tens of thousands of years before rapidly changing in industrialized countries, raising possible health concerns for modern people, scientists reported on Wednesday.", "kr": "우리 장 속에 사는 수조 개의 미생물을 통틀어 일컫는 인체 마이크로바이옴은 수만 년 동안 안정적인 생태계였는데, 산업화된 국가들에서 급격히 변하면서 현대인의 건강에 대한 우려를 낳을 수 있다고 과학자들이 수요일 보고했습니다."}, {"en": "In a study of Africans and South Americans, researchers identified more than 600 species of bacteria that may once have been common in the gut but are now rare or missing entirely from people in most societies today.", "kr": "아프리카인과 남미인을 대상으로 한 연구에서, 연구자들은 한때 장 안에서 흔했지만 오늘날 대부분의 사회에서는 드물어지거나 아예 사라져 버린 박테리아 종을 600종 넘게 확인했습니다."}, {"en": "Many of these microbes may have benefited people's health, said Justin Sonnenburg, a microbiome scientist at Stanford University and an author of the new study, published in Nature.", "kr": "이 미생물들 가운데 다수는 사람들의 건강에 이로웠을 수 있다고, 스탠퍼드 대학교의 마이크로바이옴 과학자이자 네이처(Nature)에 실린 이번 연구의 저자인 저스틴 소넨버그(Justin Sonnenburg)가 말했습니다."}, {"en": "The changing microbiome, he speculated, may have helped increase some disorders that are common in the industrialized world, from allergies to dementia.", "kr": "그는 변화한 마이크로바이옴이 알레르기부터 치매까지 산업화된 세계에서 흔한 여러 질환을 늘리는 데 한몫했을 수 있다고 추측했습니다."}, {"en": "\"How bad could this be, the fact that we changed our microbiomes so much?\" Sonnenburg said.", "kr": "\"우리가 마이크로바이옴을 그토록 많이 바꿔 버렸다는 사실이 얼마나 나쁠 수 있겠어요?\"라고 소넨버그는 말했습니다."}, {"en": "\"This study, I think, points to the fact that it could be pretty bad.\"", "kr": "\"제 생각에 이 연구는 그것이 꽤 나쁠 수 있다는 사실을 가리키고 있습니다.\""}, {"en": "As humans expanded from Africa about 50,000 years ago, they were still living on the animals they hunted and the wild plants they gathered.", "kr": "약 5만 년 전 인류가 아프리카에서 퍼져 나갈 무렵에도 사람들은 여전히 사냥한 동물과 채집한 야생 식물을 먹고 살았습니다."}, {"en": "It was only about 10,000 years ago that farmers began domesticating crops, precipitating another likely shift in the microbiome.", "kr": "농부들이 작물을 재배하기 시작한 것은 불과 약 1만 년 전의 일로, 이는 마이크로바이옴에 또 한 번의 변화를 촉발했을 가능성이 큽니다."}, {"en": "In recent decades, an even more substantive change took place, as billions of people began eating food rich in sugar and refined grains.", "kr": "최근 수십 년 동안에는 수십억 명의 사람들이 설탕과 정제 곡물이 풍부한 음식을 먹기 시작하면서 훨씬 더 실질적인 변화가 일어났습니다."}, {"en": "And modern medicine also may have had a profound effect: Antibiotics have saved countless lives, but the drugs can also destroy beneficial microbes in the gut.", "kr": "그리고 현대 의학도 깊은 영향을 미쳤을 수 있습니다. 항생제는 수많은 생명을 구했지만, 이 약은 장 속의 유익한 미생물까지 파괴할 수 있기 때문입니다."}, {"en": "In all, the findings hint that hunter-gatherers shared a distinctive ecosystem of gut microbes for tens of thousands of years.", "kr": "종합하면, 이번 연구 결과는 수렵·채집인들이 수만 년 동안 독특한 장내 미생물 생태계를 공유해 왔음을 암시합니다."}, {"en": "\"Our biology has probably been shaped by these microbes to a large degree,\" Sonnenburg said.", "kr": "\"우리의 생물학적 특성은 아마도 이 미생물들에 의해 상당 부분 형성되었을 것입니다\"라고 소넨버그는 말했습니다."}, {"en": "The ancestral bacteria might have been important for training our immune systems, for example, or synthesizing compounds our bodies need.", "kr": "예를 들어 조상 대대로 이어져 온 박테리아는 우리의 면역 체계를 훈련시키거나 우리 몸에 필요한 화합물을 합성하는 데 중요했을 수 있습니다."}, {"en": "And as some microbes vanished in modern societies, new ones took their place.", "kr": "그리고 현대 사회에서 일부 미생물이 사라지면서 새로운 미생물들이 그 자리를 대신했습니다."}, {"en": "That shift may be impacting our health.", "kr": "그러한 변화는 우리의 건강에 영향을 미치고 있을 수 있습니다."}, {"en": "\"You end up with a microbiome that's very different than what your human genome has come to expect,\" perhaps triggering inflammation and other unhealthy changes, Sonnenburg said.", "kr": "\"결국 여러분은 인간의 유전자가 기대해 온 것과는 아주 다른 마이크로바이옴을 갖게 되며\", 이는 아마도 염증과 그 밖의 건강에 해로운 변화를 촉발할 수 있다고 소넨버그는 말했습니다."}, {"en": "But Marie-Claire Arrieta, a microbiome scientist at the University of Alberta who was not involved in the research, cautioned that people in industrialized countries should not try to culture a hunter-gatherer microbiome.", "kr": "하지만 이번 연구에는 참여하지 않은 앨버타 대학교의 마이크로바이옴 과학자 마리-클레어 아리에타(Marie-Claire Arrieta)는 산업화된 국가의 사람들이 수렵·채집인의 마이크로바이옴을 배양하려 해서는 안 된다고 경고했습니다."}, {"en": "Instead, Arrieta favored learning about the helpful things that the ancestral microbes can do in the human body, and finding ways to restore those particular functions.", "kr": "대신 아리에타는 조상 대대로 이어져 온 미생물이 인체에서 할 수 있는 유익한 일들을 알아내고, 그러한 특정 기능들을 회복할 방법을 찾는 쪽을 선호했습니다."}, {"en": "\"The message that we should go back to ancient microbiomes doesn't make a lot of sense,\" Arrieta said.", "kr": "\"고대의 마이크로바이옴으로 돌아가야 한다는 주장은 별로 이치에 맞지 않습니다\"라고 아리에타는 말했습니다."}, {"en": "\"But, for sure, they're important to study to understand some of these microbial functions that have been lost.\"", "kr": "\"하지만 분명한 것은, 잃어버린 이러한 미생물 기능 일부를 이해하기 위해서라도 그것들을 연구하는 것이 중요하다는 점입니다.\""}]}, {"slug": "2026-10-22", "date": "2026.10.22. Thu.", "title_en": "Should You Put Your Books in the Freezer?", "author": "Martine Thompson", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364953?hmpMnuId=101", "sentences": [{"en": "Maybe it’s been a while since you revisited that favorite novel.", "kr": "좋아하는 소설을 다시 펼쳐본 지 꽤 오래됐을지도 모릅니다."}, {"en": "Or there’s a book you’ve always wanted to read, and you finally have time.", "kr": "아니면 늘 읽고 싶었던 책이 있는데 드디어 시간이 났을 수도 있습니다."}, {"en": "You settle in, flip open the cover, and there it is: a tiny critter skittering across the page.", "kr": "자리를 잡고 앉아 표지를 넘기면, 바로 그것이 보입니다. 책장 위를 빠르게 기어가는 작은 벌레 말이죠."}, {"en": "Then another.", "kr": "그리고 또 한 마리."}, {"en": "Or you spot distressing signs that something has been eating — and living in — the pages.", "kr": "아니면 무언가가 책장을 갉아먹고 그 안에 살고 있다는 불길한 흔적을 발견하게 됩니다."}, {"en": "Book lice are a thing.", "kr": "책좀(book lice)은 실제로 있는 벌레입니다."}, {"en": "So are silverfish — those small, slithering insects attracted to starchy materials found in books and their bindings.", "kr": "좀벌레(silverfish)도 마찬가지입니다. 책과 제본에 들어 있는 녹말 성분에 끌리는, 작고 미끄러지듯 움직이는 곤충이죠."}, {"en": "Mold can move in.", "kr": "곰팡이가 자리 잡을 수도 있습니다."}, {"en": "So if you buy a book at a garage sale or secondhand store, or pluck one off a stoop or from a Little Free Library, you may want to take some preventive measures.", "kr": "그래서 벼룩시장이나 중고 서점에서 책을 사거나, 현관 앞 계단이나 리틀 프리 라이브러리에서 책 한 권을 집어 왔다면, 몇 가지 예방 조치를 취하는 것이 좋습니다."}, {"en": "Which brings us to the freezer.", "kr": "그래서 등장하는 것이 바로 냉동실입니다."}, {"en": "Logan Spurgeon, the author of “Hinterland” and “Sourwood,” started freezing his books after bringing several home from a thrift store with a noticeable smell.", "kr": "『힌터랜드(Hinterland)』와 『사워우드(Sourwood)』의 저자 로건 스펄전(Logan Spurgeon)은 중고 상점에서 냄새가 나는 책 몇 권을 집에 가져온 뒤로 책을 얼리기 시작했습니다."}, {"en": "While researching ways to deodorize them, he found advice on examining and freezing books to get rid of pests.", "kr": "책 냄새를 없애는 방법을 알아보던 중, 그는 해충을 없애기 위해 책을 검사하고 얼리라는 조언을 발견했습니다."}, {"en": "He later posted a video about the practice and was surprised at the attention it received.", "kr": "그는 나중에 이 방법에 관한 영상을 올렸는데, 그 영상이 받은 관심에 놀랐습니다."}, {"en": "Some viewers were encountering the idea of book lice for the first time.", "kr": "일부 시청자들은 책좀이라는 개념을 처음 접했습니다."}, {"en": "Others debated whether freezing would actually work.", "kr": "다른 사람들은 얼리는 것이 실제로 효과가 있을지 논쟁을 벌였습니다."}, {"en": "The answer is yes.", "kr": "답은 ‘그렇다’입니다."}, {"en": "Kristi Westberg, interim head of preservation and conservation at the Huntington Library, Art Museum and Botanical Gardens in San Marino, California, confirms that freezing is an effective way to deal with bugs in books.", "kr": "캘리포니아주 샌머리노에 있는 헌팅턴 도서관·미술관·식물원의 보존·복원 임시 책임자 크리스티 웨스트버그(Kristi Westberg)는 냉동이 책 속 벌레를 처리하는 효과적인 방법임을 확인해 줍니다."}, {"en": "There’s more to freezing a book than just tossing it next to the ice cream.", "kr": "책을 얼리는 것은 단지 아이스크림 옆에 던져 넣는 것보다 훨씬 더 많은 것을 요구합니다."}, {"en": "Books should be placed in a sealed bag before freezing.", "kr": "책은 얼리기 전에 밀봉된 봉투에 넣어야 합니다."}, {"en": "That keeps insects away from food and prevents condensation from forming on the book as it thaws.", "kr": "그렇게 하면 벌레가 음식에 접근하는 것을 막고, 해동될 때 책에 물방울(결로)이 생기는 것도 방지할 수 있습니다."}, {"en": "Westberg recommends leaving books in the freezer for at least three days, and up to six days for extra caution.", "kr": "웨스트버그는 책을 냉동실에 최소 3일, 더 조심하려면 최대 6일까지 넣어 둘 것을 권합니다."}, {"en": "For serious infestations, a second round of freezing can be worthwhile, because eggs laid by certain insects may survive the first freezing session and hatch later.", "kr": "해충이 심하게 번식한 경우에는 두 번째 냉동이 가치가 있을 수 있는데, 특정 곤충이 낳은 알은 첫 번째 냉동을 견뎌내고 나중에 부화할 수 있기 때문입니다."}, {"en": "But freezing solves only one part of the problem.", "kr": "하지만 냉동은 문제의 한 부분만 해결합니다."}, {"en": "\"Freezing addresses the pests, but if you don’t fix the source of the problem, they could return,\" Westberg said.", "kr": "\"냉동은 해충을 처리하지만, 문제의 근원을 고치지 않으면 해충이 다시 돌아올 수 있습니다\"라고 웨스트버그는 말했습니다."}, {"en": "Don’t keep your books in the garage.", "kr": "책을 차고에 보관하지 마세요."}, {"en": "Humidity is a particular concern because moisture can encourage mold growth, and mold and fungi can, in turn, provide food for book lice.", "kr": "습도는 특히 우려되는 요소인데, 습기가 곰팡이 성장을 촉진할 수 있고, 곰팡이와 균류는 다시 책좀의 먹이가 될 수 있기 때문입니다."}, {"en": "Westberg’s advice is simple: Avoid storing books in attics, basements or garages, where temperature and humidity can fluctuate.", "kr": "웨스트버그의 조언은 간단합니다. 온도와 습도가 오르내릴 수 있는 다락방, 지하실, 차고에 책을 보관하지 말라는 것입니다."}, {"en": "Instead, aim for a stable environment — roughly 60 to 77 degrees Fahrenheit and 40% to 60% relative humidity.", "kr": "대신 안정적인 환경을 목표로 하세요. 대략 화씨 60~77도(섭씨 약 15.6~25도), 상대습도 40~60%가 적당합니다."}, {"en": "For books that are especially meaningful or valuable, take an extra step: Put them in a box.", "kr": "특별히 의미가 있거나 값진 책이라면 한 단계 더 나아가 상자에 넣어 두세요."}, {"en": "Boxing a book is an easy way to extend its life, said book conservator Jeff Peachey, owner of Peachey Conservation in New York.", "kr": "책을 상자에 넣는 것은 책의 수명을 늘리는 쉬운 방법이라고, 뉴욕의 피치 컨서베이션(Peachey Conservation) 대표이자 책 보존가인 제프 피치(Jeff Peachey)는 말했습니다."}, {"en": "\"It’s a really great way to insulate your books from the light, mitigate some environmental changes and also just give it some physical protection all in one,\" he said.", "kr": "\"그것은 책을 빛으로부터 차단하고, 환경 변화를 완화하며, 물리적 보호까지 한 번에 제공하는 정말 훌륭한 방법입니다\"라고 그는 말했습니다."}, {"en": "\"Two thumbs up for protective enclosures.\"", "kr": "\"보호용 케이스에 두 엄지 척, 강력 추천합니다.\""}, {"en": "Before you buy a thrifted book, give it a sniff.", "kr": "중고 서점에서 산 책을 사기 전에 냄새를 한번 맡아 보세요."}, {"en": "Books with obvious water or mold damage — in the form of discoloration, swelling or stuck-together pages — are recycled rather than put on the shelves, Savage said.", "kr": "변색, 부풀어 오름, 페이지가 서로 달라붙음 같은 형태로 물이나 곰팡이 피해가 명백한 책들은 진열대에 놓이지 않고 재활용된다고 새비지(Savage)는 말했습니다."}, {"en": "But he’s careful to distinguish books damaged by mold from those with fading from sun damage or that give off the characteristic smell of an older book.", "kr": "하지만 그는 곰팡이로 손상된 책을, 햇빛에 의한 퇴색이 있거나 오래된 책 특유의 냄새를 풍기는 책과 구분하는 데 신중을 기합니다."}, {"en": "For readers trying to tell the difference themselves, a musty or mildewlike smell is worth noting, particularly if it comes with visible spotting or evidence of water damage.", "kr": "그 차이를 스스로 구분하려는 독자라면, 특히 눈에 보이는 얼룩이나 물에 젖은 흔적이 동반될 경우 퀴퀴하거나 곰팡이 같은 냄새를 눈여겨봐야 합니다."}, {"en": "Smell alone isn’t a definitive test, but it can signal moisture exposure.", "kr": "냄새만으로는 결정적인 판단 기준이 되지 않지만, 습기에 노출됐다는 신호가 될 수는 있습니다."}, {"en": "If a used book smells distinctly musty, separate it from your other books.", "kr": "중고 책에서 뚜렷하게 퀴퀴한 냄새가 난다면, 다른 책들과 분리해 두세요."}]}, {"slug": "2026-10-21", "date": "2026.10.21. Wed.", "title_en": "New York's Latest Famous Family Is a Hoot. Yes, They're Owls.", "author": "Christopher Maag", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364821?hmpMnuId=101", "sentences": [{"en": "Weeks passed.", "kr": "몇 주가 흘렀습니다."}, {"en": "Williams and her husband, Sam, kept hearing the same odd screech.", "kr": "윌리엄스와 남편 샘은 계속해서 같은 이상한 끽끽거리는 소리를 들었습니다."}, {"en": "Sam Williams was on the patio the evening of Oct. 3 when he saw the dark blur of an animal flying by.", "kr": "샘 윌리엄스는 10월 3일 저녁 테라스에 있다가, 날아가는 동물의 어두운 그림자를 보았습니다."}, {"en": "His wife tried to take a picture of the creature, but it seemed too dark to see anything.", "kr": "아내는 그 생물체의 사진을 찍으려 했지만, 너무 어두워서 아무것도 보이지 않는 듯했습니다."}, {"en": "Moments later, she checked the photo on her phone.", "kr": "잠시 후, 그녀는 휴대폰의 사진을 확인했습니다."}, {"en": "To her surprise, she saw the image of a barn owl, a species seldom spotted in Manhattan.", "kr": "놀랍게도 그녀는 맨해튼에서는 좀처럼 목격되지 않는 종인 가면올빼미(barn owl)의 모습을 보았습니다."}, {"en": "Its heart-shaped face was turned to look over its brown wings, exposing its belly, which was covered in feathers the color of butterscotch.", "kr": "하트 모양의 얼굴은 갈색 날개 너머를 바라보도록 돌려져 있었고, 버터스카치 색깔의 깃털로 덮인 배가 드러나 있었습니다."}, {"en": "She named the bird Scotty.", "kr": "그녀는 그 새에게 스코티(Scotty)라는 이름을 붙였습니다."}, {"en": "Then came another surprise: Scotty was not alone.", "kr": "그런데 또 다른 놀라움이 있었습니다. 스코티가 혼자가 아니었던 것입니다."}, {"en": "A block away, atop a building on West 75th Street near Central Park West, the Williamses could faintly see an entire family of barn owls perched on the roof of a water tower.", "kr": "한 블록 떨어진 센트럴파크웨스트 근처 웨스트 75번가의 한 건물 꼭대기에서, 윌리엄스 부부는 물탱크 지붕에 앉아 있는 가면올빼미 가족 전체를 희미하게 볼 수 있었습니다."}, {"en": "They sent pictures of the birds to West Side Rag, a newspaper that covers the neighborhood.", "kr": "그들은 새들의 사진을 그 동네를 다루는 신문인 웨스트사이드 래그(West Side Rag)에 보냈습니다."}, {"en": "From there, the pictures were picked up by local TV stations and spread across social media.", "kr": "그 사진들은 지역 TV 방송국들에 의해 받아들여졌고 소셜미디어 전역으로 퍼져나갔습니다."}, {"en": "New York City's newest owl celebrities had arrived.", "kr": "뉴욕시의 새로운 올빼미 유명인사들이 등장한 것입니다."}, {"en": "\"They fly really close, almost like they're dive bombing us,\" Sam Williams said.", "kr": "\"그들은 정말 가까이 날아다니는데, 마치 우리에게 급강하 폭격을 하는 것 같아요\"라고 샘 윌리엄스는 말했습니다."}, {"en": "\"We definitely want to stay out of their way.\"", "kr": "\"우리는 확실히 그들의 길을 피해 있고 싶어요.\""}, {"en": "In nature, the animals like to nest in hollowed-out trees, and in inhabited areas, they prefer abandoned barns and grain silos.", "kr": "자연에서 이 새들은 속이 빈 나무에 둥지를 틀기를 좋아하고, 사람이 사는 지역에서는 버려진 헛간과 곡물 저장 사일로를 선호합니다."}, {"en": "A metropolis like New York presents few opportunities for quiet, out-of-the-way nesting.", "kr": "뉴욕 같은 대도시는 조용하고 외딴 곳에 둥지를 틀 기회가 거의 없습니다."}, {"en": "Barn owl populations have declined \"at an alarming rate\" over the last 20 years, the state has found, as marsh and grassland habitats have been lost to development.", "kr": "주 정부 조사에 따르면, 습지와 초원 서식지가 개발로 사라지면서 가면올빼미 개체 수는 지난 20년 동안 '놀라울 정도로 빠른 속도로' 감소해 왔습니다."}, {"en": "Given all the environmental pressures elsewhere, the arrival of barn owls in Manhattan is great news, said Jessica Wilson, executive director of NYC Bird Alliance.", "kr": "다른 곳에서의 온갖 환경적 압박을 고려하면, 맨해튼에 가면올빼미가 나타난 것은 아주 반가운 소식이라고 NYC 버드 얼라이언스(NYC Bird Alliance)의 사무국장 제시카 윌슨(Jessica Wilson)은 말했습니다."}, {"en": "It's the first time in modern history that barn owls are known to have nested in Manhattan.", "kr": "맨해튼에서 가면올빼미가 둥지를 튼 것으로 확인된 것은 근대 역사상 처음입니다."}, {"en": "Even with these limitations, some facts about the family are known.", "kr": "이러한 한계에도 불구하고, 이 가족에 대해 알려진 몇 가지 사실이 있습니다."}, {"en": "The owls begin their evenings at about 7:45 p.m. with a series of screeches, Elisabeth Williams said.", "kr": "올빼미들은 오후 7시 45분쯤 일련의 끽끽거리는 소리로 저녁을 시작한다고 엘리자베스 윌리엄스(Elisabeth Williams)는 말했습니다."}, {"en": "The adolescents hop along the water tower's roof and take short test flights.", "kr": "새끼 올빼미들은 물탱크 지붕을 따라 깡충깡충 뛰고 짧은 시험 비행을 합니다."}, {"en": "Then the adults depart.", "kr": "그런 다음 어미 올빼미들이 떠납니다."}, {"en": "Sometimes, they perch on sections of the Kenilworth Building on Central Park West, scanning alleys and the park for mice and rats.", "kr": "때때로 그들은 센트럴파크웨스트의 케닐워스 빌딩(Kenilworth Building) 구역에 앉아, 쥐와 들쥐를 찾아 골목과 공원을 살핍니다."}, {"en": "When they return with food, the children hop with excitement.", "kr": "먹이를 물고 돌아오면, 새끼들은 신이 나서 깡충깡충 뜁니다."}, {"en": "By 10 p.m., the horrifying screeches begin to quiet.", "kr": "오후 10시가 되면, 그 끔찍한 끽끽거리는 소리가 잦아들기 시작합니다."}, {"en": "\"You can make it all out by silhouette,\" said Sam Williams, who watches the family's routine without the aid of high-powered cameras.", "kr": "\"실루엣만으로도 모든 것을 알아볼 수 있어요\"라고, 고성능 카메라의 도움 없이 이 가족의 일상을 지켜보는 샘 윌리엄스는 말했습니다."}, {"en": "Online, excitement about the owls is building.", "kr": "온라인에서는 올빼미들에 대한 관심과 흥분이 커지고 있습니다."}, {"en": "Barrett has nearly 100,000 followers on the social platform X, including hundreds he acquired in the past week after he started posting pictures of the barn owls.", "kr": "배럿(Barrett)은 소셜 플랫폼 X에서 약 10만 명의 팔로워를 보유하고 있는데, 지난주 가면올빼미 사진을 올리기 시작한 뒤로 수백 명이 새로 늘었습니다."}, {"en": "Lydia Sugarman is among the owls' new fans.", "kr": "리디아 슈거먼(Lydia Sugarman)은 올빼미들의 새로운 팬 중 한 명입니다."}, {"en": "Tired of all the recent news about wars and disasters, she can't wait for New York's famous owl family to get a social media account of its own.", "kr": "최근의 전쟁과 재난 소식에 지쳐 있던 그녀는 뉴욕의 유명한 올빼미 가족이 자체 소셜미디어 계정을 갖게 되기를 손꼽아 기다리고 있습니다."}, {"en": "\"You wake up in the morning and wonder what kind of new hell are we going to have today,\" she said.", "kr": "\"아침에 일어나면 오늘은 또 어떤 새로운 재앙이 닥칠지 궁금해지잖아요\"라고 그녀는 말했습니다."}, {"en": "\"And now we have this wonderful distraction.\"", "kr": "\"그런데 이제 우리에게 이 멋진 즐거움이 생겼어요.\""}]}, {"slug": "2026-10-20", "date": "2026.10.20. Tue.", "title_en": "4,200 Miles From Graceland, This Town Is Crazy About Elvis", "author": "Chloe W. Shakin", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364613?hmpMnuId=101", "sentences": [{"en": "Like many British seaside destinations, the Welsh town of Porthcawl offers good surfing, fish and chips, and an amusement park.", "kr": "영국의 많은 해변 휴양지들처럼, 웨일스의 포스코얼(Porthcawl) 마을은 훌륭한 서핑과 피시앤드칩스, 그리고 놀이공원을 갖추고 있습니다."}, {"en": "But it is perhaps best known for something decidedly American: celebrating the life and music of Elvis Presley.", "kr": "하지만 이곳은 아주 미국적인 어떤 것으로 가장 잘 알려져 있는데, 바로 엘비스 프레슬리(Elvis Presley)의 삶과 음악을 기리는 것입니다."}, {"en": "Every September, it hosts one of the world’s largest gatherings of Elvis tribute artists and fans.", "kr": "매년 9월, 이곳은 엘비스 헌정 아티스트와 팬들이 모이는 세계 최대 규모의 행사 중 하나를 개최합니다."}, {"en": "The town, once a popular vacation spot for Welsh coal miners, became somewhat forgotten as warmer vacations in mainland Europe became more accessible in the 1970s.", "kr": "한때 웨일스 탄광 노동자들의 인기 휴양지였던 이 마을은, 1970년대 들어 더 따뜻한 유럽 본토로의 휴가가 쉬워지면서 어느 정도 잊혔습니다."}, {"en": "But the Porthcawl Elvis Festival has changed that, said Peter Phillips, the event’s organizer.", "kr": "하지만 포스코얼 엘비스 페스티벌이 그 상황을 바꿔 놓았다고, 행사 주최자인 피터 필립스(Peter Phillips)는 말했습니다."}, {"en": "The festival now draws about 40,000 attendees each year — more than doubling the town’s population for a weekend.", "kr": "이 페스티벌은 이제 매년 약 4만 명의 참가자를 끌어모으는데, 이는 주말 동안 마을 인구를 두 배 이상으로 늘리는 수준입니다."}, {"en": "“You couldn’t think of a more inappropriate place to put an Elvis festival,” Phillips said.", "kr": "“엘비스 페스티벌을 열기에 이보다 더 어울리지 않는 곳은 생각하기 어려울 겁니다”라고 필립스는 말했습니다."}, {"en": "“But it seems to work.”", "kr": "“하지만 잘 들어맞는 것 같습니다.”"}, {"en": "Porthcawl’s first Elvis festival took place in 2004 after Phillips was asked to come up with a fundraiser for the Grand Pavilion, an old seafront event space that was at risk of closure.", "kr": "포스코얼의 첫 엘비스 페스티벌은 2004년에 열렸는데, 폐쇄 위기에 놓여 있던 오래된 해변 행사장인 그랜드 파빌리언(Grand Pavilion)을 위한 기금 모금 행사를 구상해 달라는 요청을 필립스가 받은 뒤였습니다."}, {"en": "Having attended an Elvis tribute competition at the Mall of America in Bloomington, Minnesota, just two weeks earlier, Phillips entertained what he considered an outrageous thought: Why not bring Elvis to Porthcawl?", "kr": "바로 2주 전에 미네소타주 블루밍턴의 몰 오브 아메리카(Mall of America)에서 열린 엘비스 헌정 대회에 참석했던 필립스는, 스스로도 터무니없다고 여긴 생각을 품게 됐습니다. “엘비스를 포스코얼로 데려오면 어떨까?”라는 생각이었습니다."}, {"en": "Wales has no confirmed ties to Elvis Presley, and the singer never performed outside North America.", "kr": "웨일스는 엘비스 프레슬리와 확인된 인연이 없고, 이 가수는 북미 밖에서 공연한 적이 없습니다."}, {"en": "But even in a small town like Porthcawl, Elvis’ blending of styles like gospel and country, his inspirational rags-to-riches story and his flashy fashion appeal to retirees and 5-year-olds alike, Phillips said.", "kr": "하지만 포스코얼처럼 작은 마을에서조차, 가스펠과 컨트리 같은 장르를 융합한 엘비스의 음악과 감동적인 신데렐라 스토리, 그리고 화려한 패션은 은퇴자부터 다섯 살 아이까지 모두를 사로잡는다고 필립스는 말했습니다."}, {"en": "“It’s an iconic image,” he said.", "kr": "“그것은 상징적인 이미지입니다”라고 그는 말했습니다."}, {"en": "“That’s why Elvis just keeps going.”", "kr": "“그래서 엘비스가 계속 살아남는 것입니다.”"}, {"en": "There were bachelor and bachelorette parties, Elvis jumpsuits zipped down to expose hairy belly buttons, and black Priscilla Presley wigs askew.", "kr": "총각·처녀 파티가 열리고, 배꼽 털이 드러나도록 지퍼를 내린 엘비스 점프수트를 입은 사람들, 그리고 비뚤게 쓴 검은 프리실라 프레슬리(Priscilla Presley) 가발을 쓴 사람들이 있었습니다."}, {"en": "“Welsh people like to dress up,” said Darren Jones, an Elvis tribute artist who has attended every Porthcawl festival since 2004.", "kr": "“웨일스 사람들은 분장하는 것을 좋아해요”라고, 2004년부터 포스코얼 페스티벌에 매번 참석해 온 엘비스 헌정 아티스트 대런 존스(Darren Jones)는 말했습니다."}, {"en": "“They like to have a party.”", "kr": "“그들은 파티하는 것을 좋아합니다.”"}, {"en": "Known as “the land of song,” Wales has bred talents like Tom Jones — who was influenced by, and friends with, Elvis — as well as Shirley Bassey and Bonnie Tyler.", "kr": "“노래의 땅”으로 알려진 웨일스는, 엘비스에게 영향을 받고 엘비스와 친구였던 톰 존스(Tom Jones)를 비롯해 셜리 배시(Shirley Bassey)와 보니 타일러(Bonnie Tyler) 같은 인재들을 배출했습니다."}, {"en": "That helps explain why it’s home to so many Elvis fans, Darren Jones said.", "kr": "그 점이 바로 웨일스에 엘비스 팬이 그토록 많은 이유를 설명해 준다고 대런 존스는 말했습니다."}, {"en": "“We love a singer,” he said.", "kr": "“우리는 가수를 사랑합니다”라고 그는 말했습니다."}, {"en": "“We’re born to sing.”", "kr": "“우리는 노래하기 위해 태어났습니다.”"}, {"en": "In a working-class town like Porthcawl, Elvis’ story of transcending his humble means, but not forgetting them, hits home — and compels people to return to the festival each year.", "kr": "포스코얼 같은 노동자 계층의 마을에서, 가난한 출신을 극복하면서도 그 기원을 잊지 않은 엘비스의 이야기는 크게 와닿으며, 사람들로 하여금 매년 페스티벌에 다시 찾아오게 만듭니다."}, {"en": "“The fantasy of absolute ambition and faith in one’s own talent against all odds, and a vision that amounts to total outsized excess and making it, is really something that still I think has wide appeal,” said Eric Lott, a cultural historian at the City University of New York who has written about Elvis and his legacy.", "kr": "“온갖 역경에도 불구하고 자신의 재능에 대한 절대적인 야망과 신념, 그리고 모든 것을 뛰어넘는 과도한 화려함과 성공으로 이어지는 비전이라는 판타지는, 지금도 정말 폭넓은 매력을 지닌 것이라고 저는 생각합니다”라고, 엘비스와 그의 유산에 대해 저술한 뉴욕시립대학교의 문화사학자 에릭 로트(Eric Lott)는 말했습니다."}, {"en": "And in Porthcawl, the spirit is catching.", "kr": "그리고 포스코얼에서는 그 열기가 전염되고 있습니다."}, {"en": "“Whether they’re out there for the drinking or the Elvis, they soon become an Elvis fan,” Jones said.", "kr": "“사람들이 술을 마시러 왔든 엘비스를 보러 왔든, 곧 엘비스 팬이 됩니다”라고 존스는 말했습니다."}]}, {"slug": "2026-10-19", "date": "2026.10.19. Mon.", "title_en": "Cancer Vaccines Are the NIH’s Next ‘Big Bet’", "author": "Gina Kolata", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364441?hmpMnuId=101", "sentences": [{"en": "A new type of cancer treatment — vaccines — is so promising that it demands a national effort to expedite discoveries, said the director of the National Cancer Institute, Dr. Anthony Letai.", "kr": "암 치료의 새로운 유형인 백신이 매우 유망해서, 발견을 앞당기기 위한 국가적 노력이 필요하다고 국립암연구소(NCI) 소장인 앤서니 레타이(Anthony Letai) 박사가 말했습니다."}, {"en": "“We can do things that would not otherwise be done,” he said of new resources being made available at the National Institutes of Health.", "kr": "국립보건원(NIH)에서 새로 마련되는 자원에 대해 그는 “그렇지 않았다면 할 수 없었을 일들을 해낼 수 있습니다”라고 말했습니다."}, {"en": "“We can place big bets on new ideas.”", "kr": "“새로운 아이디어에 과감하게 베팅할 수 있습니다.”"}, {"en": "The big bet is a planned public-private partnership involving the NIH, the nonprofit Foundation for the NIH, researchers, pharmaceutical and biotech companies, advocacy groups, philanthropies and patients, all working together to develop and test the vaccines.", "kr": "이 큰 베팅은 NIH, 비영리 단체인 NIH 재단, 연구자들, 제약·바이오 기업들, 옹호 단체들, 자선 단체들, 환자들이 모두 함께 백신을 개발하고 시험하기 위해 협력하는, 계획된 민관 파트너십입니다."}, {"en": "The vaccines are treatments that are unique to each patient by prompting the immune system to attack a patient’s specific cancer.", "kr": "이 백신은 면역 체계가 각 환자의 특정 암을 공격하도록 유도함으로써, 환자마다 고유하게 맞춰지는 치료법입니다."}, {"en": "The injections teach the immune systems’s T cells to home in on aberrant proteins found on a patient’s tumor and nowhere else.", "kr": "이 주사는 면역 체계의 T세포가 환자의 종양에서만 발견되고 다른 곳에서는 발견되지 않는 비정상 단백질을 겨냥하도록 훈련시킵니다."}, {"en": "“We hope this will be like COVID vaccines,” said Stacey Adam, a senior clinical officer at the Foundation for the NIH, referring to the public-private partnership that led to the rapid development of vaccines for the coronavirus.", "kr": "NIH 재단의 선임 임상 책임자인 스테이시 애덤(Stacey Adam)은 코로나바이러스 백신의 신속한 개발을 이끌었던 민관 파트너십을 언급하며 “우리는 이것이 코로나 백신처럼 되길 바랍니다”라고 말했습니다."}, {"en": "She said the vaccine program was expected to begin in December, starting with a focus on pancreatic cancer, liver cancer and colorectal cancer, as well as a subset of pediatric tumors.", "kr": "그녀는 백신 프로그램이 12월에 시작될 예정이며, 췌장암·간암·대장암과 더불어 일부 소아 종양 유형에 초점을 맞추는 것으로 시작할 것이라고 말했습니다."}, {"en": "The project is still a bet: There is no guarantee that the early promise of cancer vaccines will pay off.", "kr": "이 프로젝트는 여전히 하나의 베팅입니다. 암 백신의 초기 가능성이 성과로 이어질 것이라는 보장은 없습니다."}, {"en": "The history of medicine is littered with tales of treatments that seemed incredible in early studies only to fail in larger tests.", "kr": "의학의 역사에는 초기 연구에서 놀랍게 보였다가 더 큰 규모의 시험에서 결국 실패한 치료법에 관한 이야기가 널려 있습니다."}, {"en": "Yet enthusiasm for the vaccines is running high.", "kr": "그럼에도 불구하고 이 백신에 대한 열기는 크게 고조되어 있습니다."}, {"en": "“This is a completely new frontier,” said Karen Knudsen, CEO of the Parker Institute.", "kr": "“이것은 완전히 새로운 개척 분야입니다”라고 파커 연구소(Parker Institute)의 CEO인 캐런 크누드슨(Karen Knudsen)은 말했습니다."}, {"en": "The institute has two representatives working with the NIH initiative and is also funding vaccine studies, positioning them as one of its main priorities.", "kr": "이 연구소는 NIH 이니셔티브와 함께 일하는 두 명의 대표를 두고 있으며, 백신 연구에도 자금을 지원하면서 이를 주요 우선순위 중 하나로 삼고 있습니다."}, {"en": "So far, just one vaccine study has been large enough to show definitive results.", "kr": "지금까지 확정적인 결과를 보여줄 만큼 규모가 컸던 백신 연구는 단 하나뿐입니다."}, {"en": "It involved 1,137 people with advanced melanoma.", "kr": "그 연구에는 진행성 흑색종 환자 1,137명이 참여했습니다."}, {"en": "Merck and Moderna, which conducted the study, reported in August that the vaccine increased the time before cancers recurred and increased the time before they spread.", "kr": "이 연구를 수행한 머크(Merck)와 모더나(Moderna)는 8월에 이 백신이 암이 재발하기까지의 시간과 암이 퍼지기까지의 시간을 모두 늘렸다고 보고했습니다."}, {"en": "The companies plan to reveal the full data set later this month.", "kr": "두 회사는 이달 말에 전체 데이터 세트를 공개할 계획입니다."}, {"en": "Adam was optimistic: “The science is there, the technologies are there,” she said.", "kr": "애덤은 낙관적이었습니다. “과학도 이미 있고, 기술도 이미 있습니다”라고 그녀는 말했습니다."}, {"en": "“Everything is coming to a head,” she added.", "kr": "“모든 것이 무르익고 있습니다”라고 그녀는 덧붙였습니다."}, {"en": "“Now is the time to jump-start.”", "kr": "“지금이 바로 본격적으로 추진해야 할 때입니다.”"}, {"en": "That initial study, though — promising as it was — was not definitive.", "kr": "하지만 그 최초의 연구는 유망하기는 했지만 결정적이지는 않았습니다."}, {"en": "“We cannot prove that vaccines are making patients live longer,” Balachandran said.", "kr": "“우리는 백신이 환자의 수명을 늘리고 있다는 것을 증명할 수 없습니다”라고 발라찬드란(Balachandran)은 말했습니다."}, {"en": "His group and its industry partners began a much bigger study in 2023, enrolling 260 patients.", "kr": "그의 연구팀과 업계 파트너들은 2023년에 260명의 환자를 등록한 훨씬 더 큰 규모의 연구를 시작했습니다."}, {"en": "Based on what he has seen so far, Balachandran is hopeful about the future of vaccine therapy.", "kr": "지금까지 본 결과를 바탕으로, 발라찬드란은 백신 요법의 미래에 대해 희망을 갖고 있습니다."}, {"en": "With pancreatic cancer, he took on a cancer thought to be impervious to immune system attacks: “If we crack the toughest nut,” he said, “we can crack the rest.”", "kr": "췌장암의 경우, 그는 면역 체계의 공격에 영향받지 않는다고 여겨졌던 암에 도전했습니다. “가장 어려운 문제를 풀 수 있다면 나머지도 풀 수 있습니다”라고 그는 말했습니다."}]}, {"slug": "2026-10-16", "date": "2026.10.16. Fri.", "title_en": "The Very Online Push for Snail Mail", "author": "Maria Santa Poggi", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364171?hmpMnuId=101", "sentences": [{"en": "In late June, the content creator Em-J Staples posted an open call on TikTok to play matchmaker for anyone who wanted a \"summer buddy\" pen pal.", "kr": "6월 말, 콘텐츠 크리에이터 엠제이 스테이플스(Em-J Staples)는 '여름 친구' 펜팔을 원하는 사람에게 짝을 찾아주겠다며 틱톡에 공개 모집 글을 올렸습니다."}, {"en": "\"I had a pen pal in Girl Scouts growing up,\" said Staples, 37, and, as a millennial and a mother to a 1-year-old and a 3-year-old, \"I want to relive my summers with them.\"", "kr": "\"어렸을 때 걸스카우트에서 펜팔 친구가 있었어요\"라고 37세의 스테이플스는 말했습니다. 밀레니얼 세대이자 1살과 3살 아이의 엄마인 그는 \"아이들과 함께 여름을 다시 보내고 싶어요\"라고 덧붙였습니다."}, {"en": "\"I was nostalgic for a '90s summer,\" she added.", "kr": "\"90년대의 여름이 그리웠어요\"라고 그녀는 덧붙였습니다."}, {"en": "The San Francisco Bay Area resident didn't anticipate going viral, but she received over 330,000 views over the following few weeks, with 14,000 individuals signing up either for email or snail mail correspondence.", "kr": "샌프란시스코 베이 에어리어에 사는 그녀는 화제가 될 줄은 예상하지 못했지만, 이후 몇 주 동안 33만 회 이상의 조회수를 기록했고, 이메일이나 일반 우편(스네일 메일)으로 편지를 주고받겠다고 신청한 사람이 1만 4천 명에 달했습니다."}, {"en": "She paired pen pals through a compatibility questionnaire she had made on Google Forms.", "kr": "그녀는 구글 폼으로 직접 만든 궁합 설문지를 통해 펜팔을 짝지어 주었습니다."}, {"en": "As of late, zillennials have been finding delight — and refuge from a complicated world — in all that exudes \"whimsy,\" a word that is now internet shorthand to characterize playful and spontaneous lifestyle choices.", "kr": "최근 들어 질레니얼(밀레니얼과 Z세대 사이에 낀 세대)은 '기발함(whimsy)'을 풍기는 모든 것에서 즐거움과 복잡한 세상으로부터의 피난처를 찾고 있는데, 이 단어는 이제 장난기 있고 즉흥적인 라이프스타일 선택을 가리키는 인터넷 약어가 되었습니다."}, {"en": "(Related: going Luddite, all things analog and \"grandma hobbies.\")", "kr": "(관련어: 러다이트 되기, 모든 아날로그적인 것, 그리고 '할머니 취미'.)"}, {"en": "As 2026 would have it, posting offline hobbies has become content of its own: \"Both of us consistently post videos of sending each other letters,\" said Ensing, who has over 24k followers on TikTok; Simme has nearly 18k.", "kr": "2026년이라는 시대가 보여주듯, 오프라인 취미를 게시하는 것 자체가 콘텐츠가 되었습니다. \"우리 둘 다 서로에게 편지를 보내는 영상을 꾸준히 올려요\"라고 틱톡 팔로워 2만 4천 명이 넘는 엔싱(Ensing)이 말했고, 시메(Simme)는 약 1만 8천 명의 팔로워를 보유하고 있습니다."}, {"en": "Ensing attributes the resurgence to a collective craving for personal connections that build gradually over time, and often that means not feeling pressure to meet in real life.", "kr": "엔싱은 이런 부활이 시간이 지나며 서서히 쌓이는 개인적 연결에 대한 집단적 갈망 덕분이라고 보며, 이는 곧 실제로 만나야 한다는 부담감을 느끼지 않아도 된다는 뜻이기도 합니다."}, {"en": "Sophia Hue, 21, a college senior in Idaho, has two pen pals she connected with over social media and with whom she's been corresponding for eight months.", "kr": "아이다호주의 대학 4학년인 21세의 소피아 휴(Sophia Hue)는 소셜미디어를 통해 만나 8개월째 편지를 주고받아 온 펜팔 친구가 두 명 있습니다."}, {"en": "\"We don't have a set time when we need to respond to each other,\" she said.", "kr": "\"우리는 서로 답장해야 하는 정해진 시간이 없어요\"라고 그녀는 말했습니다."}, {"en": "\"There's a comfort element that you don't have to see them face to face.\"", "kr": "\"얼굴을 마주 보지 않아도 된다는 편안함이 있어요.\""}, {"en": "There is no one way to best find a pen pal.", "kr": "펜팔을 찾는 데 최선의 단 하나의 방법은 없습니다."}, {"en": "Some do it in social media comments sections, posting to their Story or, like Hue in the case of one pen pal, taking a risk and reaching out through DMs.", "kr": "어떤 사람들은 소셜미디어 댓글란에서 하거나, 자신의 스토리에 올리거나, 아니면 휴(Hue)가 펜팔 한 명의 경우처럼 과감하게 DM으로 먼저 연락을 시도하기도 합니다."}, {"en": "\"It's not necessarily about moving away from technology,\" said Agus Panzoni, the head of culture strategy at the trend and media platform Death To Stock (DTS).", "kr": "\"반드시 기술에서 벗어나는 것이 중요한 건 아니에요\"라고 트렌드·미디어 플랫폼 데스 투 스톡(DTS)의 문화 전략 책임자 아구스 판조니(Agus Panzoni)는 말했습니다."}, {"en": "\"It's about moving away from a format of communication that is mediated by platforms and digital systems that optimize speed, convenience and infinite access.\"", "kr": "\"속도, 편의성, 무한한 접근성을 최적화하는 플랫폼과 디지털 시스템이 매개하는 소통 방식에서 벗어나는 것이 중요하죠.\""}, {"en": "According to Panzoni, having a pen pal has steadily been on the rise since 2020, which is also when matchmakers started popping up.", "kr": "판조니에 따르면 펜팔을 갖는 것은 2020년 이후 꾸준히 증가해 왔는데, 그 시기는 바로 펜팔을 짝지어 주는 중매인들이 등장하기 시작한 때이기도 합니다."}, {"en": "\"We were already seeing the rise of pen pal matching services on TikTok through the comment sections happening during the pandemic,\" she said.", "kr": "\"팬데믹 기간에 틱톡 댓글란을 통해 펜팔 매칭 서비스가 생겨나는 것을 이미 목격하고 있었어요\"라고 그녀는 말했습니다."}, {"en": "Previously, in the spring of 2020, Syme, who lives in Brooklyn and is in her early 40s, founded Penpalooza, a pen pal exchange that peaked at 15,000 subscribers.", "kr": "앞서 2020년 봄, 브루클린에 살고 40대 초반인 사임(Syme)은 구독자 1만 5천 명까지 늘어났던 펜팔 교환 서비스 '펜팔루자(Penpalooza)'를 설립했습니다."}, {"en": "Currently, she matches correspondents through her DMs since noticing people's continued hunger for letter exchanges after the world opened up again.", "kr": "현재 그녀는 세상이 다시 열린 뒤에도 사람들이 편지 교환에 대한 꾸준한 갈망을 보인다는 점을 알아차리고, 자신의 DM을 통해 서신 상대를 연결해 주고 있습니다."}, {"en": "(Her first book, \"Syme's Letter Writer,\" published in 2025, is a guide to modern correspondence and letter-writing etiquette).", "kr": "(2025년에 출간된 그녀의 첫 책 《사임의 편지 쓰기(Syme's Letter Writer)》는 현대적 서신 왕래와 편지 예절에 대한 안내서입니다.)"}, {"en": "\"People feel really alienated from one another. There's no safe place to communicate where you're not doing it out in public,\" she said, referencing the loneliness epidemic, increasing backlash to AI and the digital surveillance state.", "kr": "\"사람들은 서로에게서 정말 소외감을 느낍니다. 공개된 공간이 아닌 곳에서는 안전하게 소통할 수 있는 장소가 전혀 없어요\"라고 그녀는 외로움 유행병, AI에 대한 커져가는 반발, 그리고 디지털 감시 국가를 언급하며 말했습니다."}, {"en": "\"The mail,\" she added, \"feels sacred.\"", "kr": "\"우편물은\" 그녀가 덧붙였습니다. \"신성하게 느껴져요.\""}]}, {"slug": "2026-10-15", "date": "2026.10.15. Thu.", "title_en": "At 194, Jonathan the Giant Tortoise Knows About Aging", "author": "Monique Brouillette", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000364024?hmpMnuId=101", "sentences": [{"en": "In June, after Jonathan was erroneously declared dead by some media organizations, the Guinness World Records added him to its list of global icons, honoring his superlative status.", "kr": "6월에 일부 언론 매체가 조너선이 죽었다고 잘못 발표한 뒤, 기네스 세계기록은 그의 최고의 위상을 기리며 그를 '글로벌 아이콘' 목록에 추가했습니다."}, {"en": "And Wednesday, he reached another milestone when a study announced that his genome had been sequenced for the first time.", "kr": "그리고 수요일, 한 연구가 그의 게놈이 처음으로 해독되었다고 발표하면서 그는 또 하나의 이정표에 도달했습니다."}, {"en": "\"We almost never get to study an animal this old while it is still alive,\" said Steve Horvath, a biologist who studies aging at the UCLA, and an author of the study, which was published in the journal Science Advances.", "kr": "UCLA에서 노화를 연구하는 생물학자이자 학술지 《사이언스 어드밴시스》에 발표된 이 연구의 저자인 스티브 호바스는 \"이렇게 오래 산 동물을 살아 있는 동안 연구할 기회는 거의 없습니다\"라고 말했습니다."}, {"en": "After sequencing the sample, the scientists compared Jonathan's genome with those of tortoises 100 years his junior and found some molecular differences, especially in genes involved with DNA repair and the maintenance of the protective caps on chromosomes, called telomeres.", "kr": "샘플의 배열 순서를 밝힌 뒤, 과학자들은 조너선의 게놈을 그보다 100년 더 어린 거북들의 게놈과 비교했고, 특히 DNA 복구와 텔로미어라고 불리는 염색체 보호 캡의 유지에 관여하는 유전자에서 분자 수준의 차이를 발견했습니다."}, {"en": "As organisms age, DNA accumulates damage and the telomeres shorten, a process thought to drive aging.", "kr": "생명체가 나이 들수록 DNA에는 손상이 축적되고 텔로미어는 짧아지는데, 이 과정이 노화를 이끄는 것으로 여겨집니다."}, {"en": "The results hint that this species may have evolved to be more resilient to age-related decline, but further testing is needed.", "kr": "이 결과는 이 종이 노화에 따른 쇠퇴에 더 잘 견디도록 진화했을 수 있음을 시사하지만, 추가 검증이 필요합니다."}, {"en": "The team also discovered that Jonathan shared some genes with other long-living species like naked mole rats, which can live to 40 and rarely get cancer.", "kr": "연구팀은 또한 조너선이 40년까지 살 수 있고 암에 거의 걸리지 않는 벌거숭이두더지쥐 같은 다른 장수 종들과 일부 유전자를 공유한다는 사실도 발견했습니다."}, {"en": "Perhaps most interesting is what they found when they looked at the tortoise's epigenome, which is a map of the chemical tags that regulate the genome.", "kr": "아마도 가장 흥미로운 것은 게놈을 조절하는 화학적 표지의 지도인 후성유전체(에피게놈)를 살펴봤을 때 발견한 내용입니다."}, {"en": "These tags change with age and can lead to erratic gene activity.", "kr": "이 표지들은 나이가 들면서 변하며 불규칙한 유전자 활동을 초래할 수 있습니다."}, {"en": "As expected, Jonathan had age-related changes in his epigenome similar to older humans, but there was an exception.", "kr": "예상대로 조너선은 나이 든 인간과 유사한 후성유전체의 연령 관련 변화를 보였지만, 한 가지 예외가 있었습니다."}, {"en": "Notably, the control switches linked to mitochondria were well preserved, similar to those of a young tortoise.", "kr": "특히 미토콘드리아와 연결된 조절 스위치는 젊은 거북의 것과 비슷하게 잘 보존되어 있었습니다."}, {"en": "Mitochondria, the molecular power plants inside cells, have long been linked to healthy aging.", "kr": "세포 내부의 분자 발전소인 미토콘드리아는 오랫동안 건강한 노화와 연결되어 왔습니다."}, {"en": "The potential for learning from the biology of animals that live extraordinarily long lives is exciting for scientists who study aging.", "kr": "비범하게 오래 사는 동물들의 생물학에서 배울 수 있는 가능성은 노화를 연구하는 과학자들에게 매우 흥미로운 일입니다."}, {"en": "\"Each of these long-lived species has some kind of special trick,\" said Steve Austad, a biologist at the University of Alabama at Birmingham.", "kr": "앨라배마대학교 버밍엄의 생물학자 스티브 오스태드는 \"이런 장수 종들은 저마다 어떤 특별한 비결을 가지고 있습니다\"라고 말했습니다."}, {"en": "\"And some of those may turn out to be relevant to human aging.\"", "kr": "\"그리고 그중 일부는 인간의 노화와 관련이 있는 것으로 밝혀질 수도 있습니다.\""}, {"en": "\"The results integrate very well in the wider puzzle of what longevity is,\" said Björn Schumacher, who studies aging at the University of Cologne in Germany.", "kr": "독일 쾰른대학교에서 노화를 연구하는 비에른 슈마허는 \"이 결과는 장수가 무엇인지에 대한 더 큰 퍼즐에 아주 잘 들어맞습니다\"라고 말했습니다."}, {"en": "He urged caution, though, in concluding that Jonathan would help us understand why humans age and what we can do about it.", "kr": "하지만 그는 조너선이 인간이 왜 노화하는지, 그리고 우리가 그에 대해 무엇을 할 수 있는지를 이해하는 데 도움이 될 것이라고 결론 내리는 데에는 신중할 것을 당부했습니다."}, {"en": "Jonathan's advanced age could be an outlier because of his round-the-clock veterinary care, diet of fresh vegetables and protected lawn at the governor's house.", "kr": "조너선의 고령은 24시간 수의학적 돌봄, 신선한 채소 식단, 그리고 총독 관저의 보호받는 잔디밭 덕분에 예외적인 사례일 수 있습니다."}, {"en": "The molecular results offer tantalizing clues, however — ones that scientists are keen to explore further.", "kr": "하지만 분자 수준의 결과는 과학자들이 더 탐구하고 싶어 하는 감질나는 단서를 제공합니다."}, {"en": "\"If we had 1,000 animals like Jonathan, it would be easier to understand his longevity,\" said Stephen Clark, lead author of the study and the founder of Kallel, a nonprofit dedicated to studying the genetics of aging.", "kr": "이 연구의 주저자이자 노화 유전학 연구에 전념하는 비영리 단체 칼렐(Kallel)의 설립자인 스티븐 클라크는 \"조너선 같은 동물이 1,000마리만 있다면 그의 장수를 이해하기가 더 쉬울 것입니다\"라고 말했습니다."}, {"en": "In the future, Clark hopes to analyze more Aldabra tortoises and other long-lived species by gathering data that offers some hints for us spry chickens, too.", "kr": "앞으로 클라크는 더 많은 알다브라거북과 다른 장수 종들을 분석해, 우리처럼 상대적으로 짧게 사는 '활기찬 햇병아리'인 인간에게도 몇 가지 단서를 주는 데이터를 수집하기를 희망합니다."}]}, {"slug": "2026-10-14", "date": "2026.10.14. Wed.", "title_en": "Juniper Lattes? Pine Sodas? Food Is Taking Us Back to the Forest.", "author": "Kim Severson", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363771?hmpMnuId=101", "sentences": [{"en": "America's walk into the woods follows an era dominated by international flavors and tropical tastes like dragonfruit, the warm bakery vibe of Generation Z's \"little treats\" culture and the sweet-spicy mashup that birthed a thousand hot honey pizzas.", "kr": "미국이 숲으로 향하는 움직임은 용과 같은 국제적인 풍미와 열대의 맛, Z세대의 '작은 기쁨' 문화에서 비롯된 따뜻한 베이커리 분위기, 그리고 수많은 핫 허니 피자를 탄생시킨 달콤하면서도 매콤한 조합이 지배하던 시대를 뒤따른 것입니다."}, {"en": "\"Now we're starting to see increased interest in flavors that might be about the place, the origin, the landscape or even craftsmanship,\" said Sally Lyons Wyatt, the head of consumer goods and food service at Circana, a global market research and data analytics firm.", "kr": "글로벌 시장조사·데이터분석 기업 서카나(Circana)의 소비재·외식 서비스 부문 책임자인 샐리 라이언스 와이어트는 \"이제 우리는 장소, 원산지, 풍경, 심지어 장인정신에 관한 풍미에 대한 관심이 커지는 것을 보기 시작했습니다\"라고 말했습니다."}, {"en": "\"Consumers increasingly want flavors that evoke nature, foraging and the outdoors.\"", "kr": "\"소비자들은 자연, 채집, 그리고 야외 활동을 떠올리게 하는 풍미를 점점 더 원하고 있습니다.\""}, {"en": "Humans are hard-wired to be physically rewarded by contact with soil and plant life, she said.", "kr": "인간은 흙과 식물을 접촉할 때 신체적으로 보상을 받도록 본능적으로 설계되어 있다고 그녀는 말했습니다."}, {"en": "Flavors from the natural world tap into that, offering an antidote to unsettling digital transformation, climate change and global political conflict.", "kr": "자연 세계에서 온 풍미는 그것을 활용하여, 불안한 디지털 전환과 기후 변화, 그리고 전 세계적인 정치적 갈등에 대한 해독제 역할을 합니다."}, {"en": "A summer of food recalls and, she added, the rise of the Make America Healthy Again movement with its emphasis on natural remedies also fuel the attraction.", "kr": "그녀는 또한 식품 리콜이 잇따랐던 여름과, 자연 요법을 강조하는 '메이크 아메리카 헬시 어게인' 운동의 부상도 이러한 매력을 부추기고 있다고 덧붙였습니다."}, {"en": "Stephanie Mattucci, the principal food and drink strategist for the global food research firm Mintel, sees parallels to the Industrial Revolution and the Gilded Age, when Swiss author Johanna Spyri published \"Heidi.\"", "kr": "글로벌 식품 조사 기업 민텔(Mintel)의 수석 식음료 전략가 스테파니 마투치는 스위스 작가 요한나 슈피리가 《하이디》를 출간했던 산업혁명과 도금시대와의 유사점을 발견합니다."}, {"en": "The story of a young girl who escapes city life to seek solace living in the mountains with her grandfather was a bestseller in the United States, and remains a classic.", "kr": "도시 생활에서 벗어나 할아버지와 함께 산에서 살며 위안을 찾는 어린 소녀의 이야기는 미국에서 베스트셀러였고, 지금도 고전으로 남아 있습니다."}, {"en": "\"In this moment of great change and technological revolution, how can we ground ourselves?\" Mattucci said.", "kr": "\"이 거대한 변화와 기술 혁명의 순간에, 우리는 어떻게 중심을 잡을 수 있을까요?\"라고 마투치는 말했습니다."}, {"en": "\"People are attracted to alpine flavors as a way to step away from overstimulation and into the therapeutic benefit of the forest and the trees and mountains.\"", "kr": "\"사람들은 과도한 자극에서 벗어나 숲과 나무와 산이 주는 치유의 혜택으로 들어가기 위한 방법으로 알프스 풍미에 끌립니다.\""}, {"en": "Andrea Ramirez, Torani's trends and insight manager, said the company took note of the growing popularity of kombucha, matcha and the bitter undertones of an Aperol spritz, as well as Nordic influences like the Danish comfort concept called hygge and an increase in travel to the Dolomites and the Alps.", "kr": "토라니(Torani)의 트렌드·인사이트 매니저인 안드레아 라미레스는 회사가 콤부차와 말차, 그리고 아페롤 스프리츠의 쌉싸름한 뒷맛의 인기 상승뿐 아니라, 덴마크의 편안함 개념인 '휘게(hygge)' 같은 북유럽의 영향과 돌로미티·알프스 여행의 증가에도 주목했다고 말했습니다."}, {"en": "The piney syrup was infused with ginger and sage so it wouldn't remind anyone of a cleaning product, Ramirez said.", "kr": "솔 향 시럽에는 생강과 세이지를 넣어 세정제를 연상시키지 않도록 했다고 라미레스는 말했습니다."}, {"en": "The idea was to offer a trip to the forest in a cup.", "kr": "그 아이디어는 한 잔에 담긴 숲으로의 여행을 선사하는 것이었습니다."}, {"en": "\"If you live in the middle of the city,\" she said, \"you might not have access to clean forests of pine trees.\"", "kr": "\"도시 한복판에 산다면,\" 그녀는 말했습니다. \"깨끗한 소나무 숲을 접할 기회가 없을 수도 있습니다.\""}, {"en": "All the trend-spotter talk of \"mushroom-adjacent flavors\" and \"alpine cues\" is only partly about taking refuge from societal mayhem in the cool forest.", "kr": "트렌드를 읽는 이들이 말하는 '버섯에 가까운 풍미'와 '알프스 신호'라는 이야기는 단지 시원한 숲에서 사회적 혼란을 피해 대피하려는 것만은 아닙니다."}, {"en": "It's also about marketing and the nature of the American consumer.", "kr": "그것은 또한 마케팅과 미국 소비자의 본성에 관한 것이기도 합니다."}, {"en": "\"Part of it, to be sure, is the relentless pursuit of novelty,\" said Helen Zoe Veit, a professor of history at Michigan State University who has written two books about the nation's food.", "kr": "\"물론 그중 일부는 새로움을 향한 끊임없는 추구입니다\"라고, 미국 음식에 관한 책 두 권을 쓴 미시간주립대 역사학 교수 헬렌 조 비트는 말했습니다."}, {"en": "\"And then there is just copying other people for no other reason than everyone else is drinking green matcha or a pine-flavored soda, so I might as well have one, too.\"", "kr": "\"그리고 다른 사람들이 모두 그린 말차나 솔 향 소다를 마시고 있다는 이유 말고는 다른 이유 없이 그저 남을 따라 하는 것도 있습니다. 그래서 나도 한 잔 마셔 보는 게 낫겠다 싶은 거죠.\""}]}, {"slug": "2026-10-13", "date": "2026.10.13. Tue.", "title_en": "Forget Quiet Luxury. In Ancient Rome, the Fashion Was Loud.", "author": "Nicolas Liney", "copyright": "c.2026 The New York Times Company", "source_url": "https://home.ebs.co.kr/morning/board/6/502387/view/30000363383?hmpMnuId=101", "sentences": [{"en": "As Rome consolidated its control over the Mediterranean and beyond in the early centuries of the first millennium, a thriving trade network fueled an increasingly consumerist society.", "kr": "로마가 첫 천년기 초반 몇 세기 동안 지중해와 그 너머에 대한 지배권을 공고히 해 나가면서, 번성하던 무역 네트워크는 점점 더 소비 지향적인 사회를 부추겼습니다."}, {"en": "Fashion trends and materials, like silk, pearls and dyes, flowed in from encounters with other cultures and helped demarcate social hierarchies in Rome.", "kr": "실크, 진주, 염료 같은 패션 트렌드와 재료들은 다른 문화와의 교류를 통해 유입되어, 로마의 사회적 위계를 구분 짓는 데 기여했습니다."}, {"en": "The more exotic or rarefied your outfit was, the more clout you carried.", "kr": "복장이 더 이국적이거나 귀할수록, 그만큼 더 큰 영향력을 지녔습니다."}, {"en": "Textiles decay easily, and hard evidence for Roman fashion is vanishingly rare.", "kr": "직물은 쉽게 썩기 때문에, 로마 패션에 대한 확실한 증거는 극히 드뭅니다."}, {"en": "But Roman portrait sculpture can tell us a lot about clothing, hairstyles and jewelry — even what perfumes people used.", "kr": "하지만 로마의 초상 조각은 의복, 헤어스타일, 장신구에 대해 많은 것을 알려 줍니다 — 심지어 어떤 향수를 썼는지까지도요."}, {"en": "And because these statues broadcast idealized versions of their subjects, they reveal even more about how people wanted to be seen.", "kr": "그리고 이 조각상들은 대상 인물의 이상화된 모습을 널리 보여 주는 것이기에, 사람들이 어떻게 보이고 싶어 했는지를 한층 더 잘 드러냅니다."}, {"en": "Perhaps predictably, many sculptures in the exhibition feature a subject wearing a toga or a stola, a sort of pinafore for women.", "kr": "어쩌면 예상대로, 전시의 많은 조각상들은 토가나 여성용 원피스형 앞치마라 할 수 있는 스톨라를 입은 인물을 묘사하고 있습니다."}, {"en": "These garments, which telegraphed Roman citizenship, remained remarkably unchanged over the centuries.", "kr": "로마 시민권을 드러내는 이 의복들은 수 세기 동안 놀라울 정도로 변함없이 유지되었습니다."}, {"en": "But ornaments, hairstyles and dyes offered a way of standing out.", "kr": "그러나 장신구, 헤어스타일, 염료는 남들과 구별되는 수단을 제공했습니다."}, {"en": "Many of the statues were originally painted in vibrant pigments, although barely any trace is left today.", "kr": "많은 조각상들은 원래 선명한 색소로 채색되어 있었지만, 오늘날에는 그 흔적이 거의 남아 있지 않습니다."}, {"en": "The Glyptotek, a major center for research on the use of color in ancient sculpture, has used paint residue analysis to produce digital reconstructions displayed on screens in the show.", "kr": "고대 조각의 색채 사용 연구에서 주요 중심지인 글립토테크 미술관은 페인트 잔여물 분석을 활용해, 전시장 화면에 표시되는 디지털 복원 영상을 제작했습니다."}, {"en": "Dyes for garments were sourced from around the empire.", "kr": "의복용 염료는 제국 전역에서 조달되었습니다."}, {"en": "Purple — the most prestigious — was traditionally restricted to the garments of the elite.", "kr": "가장 권위 있는 색인 보라색은 전통적으로 엘리트 계층의 의복에만 쓰이도록 제한되었습니다."}, {"en": "The best purples came from the glands of Murex sea snails from the eastern Mediterranean, an exploitative practice that nearly drove the species to extinction.", "kr": "최고급 보라색은 동부 지중해산 무렉스 바다 달팽이의 분비샘에서 얻었는데, 이는 그 종을 거의 멸종으로 몰아간 착취적 관행이었습니다."}, {"en": "\"The word sustainability wouldn't make any sense to Romans,\" Broens said.", "kr": "\"지속가능성이라는 단어는 로마인들에게 아무 의미도 없었을 겁니다\"라고 브로엔스는 말했습니다."}, {"en": "Other dyes from imperial provinces were equally valuable and signified wealth, like kermes, a vermilion derived from insects, or saffron.", "kr": "제국의 속주들에서 온 다른 염료들도 마찬가지로 귀했고 부를 상징했는데, 곤충에서 추출한 주홍색 염료인 케르메스나 사프란이 그 예입니다."}, {"en": "These dyes were used for the clothes of wealthy citizens outside the Roman elite, including freed slaves, who were not allowed to wear purple.", "kr": "이 염료들은 보라색을 입는 것이 허용되지 않았던 해방 노예를 포함해, 로마 엘리트 계층 밖의 부유한 시민들의 옷에 사용되었습니다."}, {"en": "Other fashion trends, like hairstyles, could reflect Roman conquests.", "kr": "헤어스타일 같은 다른 패션 트렌드는 로마의 정복을 반영하기도 했습니다."}, {"en": "When Rome was struggling to subdue Germanic territories in the first century, elite women often wore wigs made from the blond hair of Germanic captives or tried to imitate the color with dye.", "kr": "로마가 1세기에 게르만 지역을 복속시키는 데 어려움을 겪고 있을 때, 엘리트 여성들은 게르만 포로의 금발 머리카락으로 만든 가발을 쓰거나, 염료로 그 색을 흉내 내려 했습니다."}, {"en": "In this case, Broens said, \"Women's beauty was quite literally constructed from subjugated peoples.\"", "kr": "이에 대해 브로엔스는 \"여성의 아름다움은 말 그대로 정복된 민족들로부터 만들어졌다\"고 말했습니다."}, {"en": "Yet not all foreign influences were harvested by force.", "kr": "하지만 모든 외래의 영향이 무력으로 거둬들여진 것은 아니었습니다."}, {"en": "As Rome's elite diversified, hairstyles were borrowed for cosmopolitan cachet.", "kr": "로마의 엘리트가 다양해지면서, 헤어스타일은 국제적인 위신을 얻기 위해 차용되었습니다."}, {"en": "Julia Domna, the wife of the emperor Septimius Severus, came from a powerful Syrian family, and her distinctive coiffure appears to have been a popular style in that region.", "kr": "셉티미우스 세베루스 황제의 아내인 율리아 돔나는 강력한 시리아 가문 출신이었고, 그녀의 독특한 머리 모양은 그 지역에서 유행하던 스타일이었던 것으로 보입니다."}, {"en": "A portrait bust in the exhibition displays the look, which was widely copied.", "kr": "전시에 나온 한 초상 흉상이 그 모습을 보여 주는데, 이 스타일은 널리 모방되었습니다."}, {"en": "We also know that perfume styles tracked the empire's expansion, with popular varieties including \"Egyptian\" and \"Assyrian.\"", "kr": "우리는 또한 향수 스타일이 제국의 확장을 따라갔다는 것을 아는데, 인기 있는 종류로는 \"이집트산\"과 \"아시리아산\"이 있었습니다."}, {"en": "Recent research shows that statues of the elite would even be regularly anointed with scents.", "kr": "최근 연구에 따르면, 엘리트의 조각상들에는 정기적으로 향을 발라 주기까지 했습니다."}, {"en": "Some recipes for scents survive, but we'll never know what they really smelled like.", "kr": "향에 대한 제조법 일부는 남아 있지만, 그것들이 실제로 어떤 향이었는지는 결코 알 수 없을 것입니다."}, {"en": "Instead, the Glyptotek invited Danish cosmetics brand Karmameju to create its own interpretations — bringing a touch of Scandinavian elegance to the imperial glitz.", "kr": "대신 글립토테크 미술관은 덴마크 화장품 브랜드 카르마메주를 초청해 나름의 해석을 만들게 했습니다 — 제국의 화려함에 스칸디나비아의 우아함을 한 스푼 더한 것이죠."}]}];
let idx = 0, rate = 1, current = null, currentBtn = null;
const view = document.getElementById('dayView');
const sel = document.getElementById('daySelect');

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function buildSelect(){
  DAYS.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=(i===0? d.date+'  (최신)' : d.date);
    sel.appendChild(o);
  });
}

const ICON_PLAY='&#9654;', ICON_PAUSE='&#10074;&#10074;';
const FAV_KEY='ebs_ms_favs';
function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
function setFavs(v){ localStorage.setItem(FAV_KEY, JSON.stringify(v)); }
function isFav(id){ return getFavs().some(f=>f.id===id); }
function toggleFav(d, n, btn){
  const id=d.slug+':'+n;
  let favs=getFavs();
  const i=favs.findIndex(f=>f.id===id);
  if(i>=0){ favs.splice(i,1); } else { favs.push({id:id, slug:d.slug, date:d.date, title_en:d.title_en, en:d.sentences[n-1].en, kr:d.sentences[n-1].kr, n:n}); }
  setFavs(favs);
  btn.innerHTML = i>=0 ? '&#9734;' : '&#9733;';
  btn.classList.toggle('on', i<0);
}
function resetBtns(){ document.querySelectorAll('.play').forEach(b=>{b.classList.remove('playing','paused'); b.innerHTML=ICON_PLAY;}); }
function stop(){
  document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0;});
  if(current)current.removeEventListener('ended',onEnded);
  current=null;currentBtn=null;resetBtns();
}
function onEnded(){
  if(currentBtn){currentBtn.classList.remove('playing','paused');currentBtn.innerHTML=ICON_PLAY;}
  current=null;currentBtn=null;
}
function toggle(i,btn){
  const a=document.getElementById('a'+i);
  if(!a)return;
  // 같은 문장: 재생 중이면 일시정지, 일시정지 상태면 이어서 재생
  if(current===a && !a.paused){ a.pause(); btn.classList.remove('playing'); btn.classList.add('paused'); btn.innerHTML=ICON_PLAY; return; }
  if(current===a && a.paused){ a.playbackRate=rate; a.play().catch(()=>{}); btn.classList.remove('paused'); btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE; return; }
  // 다른 문장: 정지 후 새로 재생
  stop();
  current=a;currentBtn=btn;a.playbackRate=rate;
  btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE;
  a.addEventListener('ended',onEnded);a.play().catch(()=>{});
}

function render(i, push){
  i=Math.max(0,Math.min(DAYS.length-1,i));
  stop();
  idx=i;
  const d=DAYS[i];
  const rows=d.sentences.map((s,n)=>'<div class="item">'
    +'<button class="play" data-i="'+(n+1)+'" aria-label="Play">&#9654;</button>'
    +'<div class="text"><div class="en"><span class="num">'+(n+1)+'.</span>'+esc(s.en)+'</div>'
    +'<div class="kr">'+esc(s.kr)+'</div></div>'
    +'<button class="fav" data-i="'+(n+1)+'" aria-label="즐겨찾기">&#9734;</button>'
    +'<audio id="a'+(n+1)+'" preload="none" src="audio/'+d.slug+'/s'+String(n+1).padStart(2,'0')+'.m4a"></audio>'
    +'</div>').join('');
  view.innerHTML='<header>'
    +'<div class="kicker">EBS 모닝스페셜 · News Coverage from The New York Times</div>'
    +'<h1>'+esc(d.title_en)+'</h1>'
    +'<div class="byline">'+esc(d.author)+' · '+esc(d.copyright)+' · '+esc(d.date)+'</div>'
    +'</header>'
    +rows
    +'<div class="foot">출처: EBS 최수진의 모닝스페셜 방송 내용 게시판 · <a href="'+esc(d.source_url)+'" target="_blank" rel="noopener">원문 보기</a><br>'
    +'본 텍스트는 학습용으로 정리한 것으로 원문과 다를 수 있습니다.</div>';

  view.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>toggle(parseInt(b.dataset.i),b)));
  view.querySelectorAll('.fav').forEach(b=>{
    const n=parseInt(b.dataset.i);
    const on=isFav(d.slug+':'+n);
    b.innerHTML=on?'&#9733;':'&#9734;';
    b.classList.toggle('on',on);
    b.addEventListener('click',()=>toggleFav(d,n,b));
  });

  sel.value=i;
  document.getElementById('prevDay').disabled = i>=DAYS.length-1;
  document.getElementById('nextDay').disabled = i<=0;
  if(push!==false) history.replaceState(null,'','#'+d.slug);
  window.scrollTo({top:0,behavior:'smooth'});
}

buildSelect();
sel.addEventListener('change',()=>render(parseInt(sel.value)));
document.getElementById('prevDay').addEventListener('click',()=>render(idx+1));
document.getElementById('nextDay').addEventListener('click',()=>render(idx-1));
document.getElementById('todayBtn').addEventListener('click',()=>render(0));

const start = DAYS.findIndex(d=>d.slug===location.hash.slice(1));
render(start>=0?start:0, false);
window.addEventListener('hashchange',()=>{ const i=DAYS.findIndex(d=>d.slug===location.hash.slice(1)); if(i>=0&&i!==idx)render(i,false); });
</script></body></html>
